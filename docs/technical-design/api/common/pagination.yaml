PageParam:
  name: page
  in: query
  required: false
  description: Zero-based page index.
  schema:
    type: integer
    minimum: 0
    default: 0

SizeParam:
  name: size
  in: query
  required: false
  description: >-
    Page size. Capped at 100 to bound a single response's payload and the
    underlying PostgreSQL Replica query cost (`../../../architecture.md`
    §4.1) — no list endpoint in this API allows an unbounded scan.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20

PageMeta:
  type: object
  description: >-
    Offset/limit pagination envelope, applied consistently across every list
    endpoint in this API. Offset/limit (not cursor/keyset) is the deliberate
    choice for this PoC-scale system — see `../README.md` for why.
  required: [page, size, totalElements, totalPages]
  properties:
    page:
      type: integer
      example: 0
    size:
      type: integer
      example: 20
    totalElements:
      type: integer
      format: int64
      example: 137
    totalPages:
      type: integer
      example: 7
