Payment:
  type: object
  description: >-
    Field-level source is `../../platform/database-schema.md` §5.1. A row
    is created `PENDING` at charge-initiation and resolved later by
    whichever of {webhook, reconciliation sweep} reaches it first
    (`../../modules/payment.md` §1) — **the charge-initiation response
    itself never carries a final `SUCCEEDED`/`FAILED` outcome**, only
    `PENDING`. No push/SSE mechanism is documented anywhere in this corpus,
    so a client observes resolution by polling `getPayment`.
  required: [id, registrationId, amount, currency, gateway, status, initiatedAt]
  properties:
    id:
      type: string
      format: uuid
    registrationId:
      type: string
      format: uuid
      description: 1:1 with the registration it pays for (`database-schema.md` §5.1's `UNIQUE` constraint).
    amount:
      type: number
      format: double
      exclusiveMinimum: 0
    currency:
      type: string
      example: VND
    gateway:
      type: string
      example: STRIPE
      description: Sandbox mode only (`../../proposal.md` §5.2).
    gatewayTransactionId:
      type: [string, 'null']
      description: >-
        Set once the gateway acknowledges the charge attempt — at
        charge-initiation, not at resolution — which is what lets the
        webhook (§7) and reconciliation sweep (§6) correlate an external
        event back to this row *before* it's resolved. Deliberately not
        tied to `status` via a structural `if`/`then`/`else` the way
        `resolvedAt` is below: unlike `resolvedAt`'s clean "iff left
        PENDING" rule, this field's set-vs-null timing genuinely depends on
        gateway behavior this corpus doesn't pin down further, so
        overconstraining it here would assert more than
        `../../modules/payment.md` §1 actually guarantees.
    status:
      $ref: '#/PaymentStatus'
    initiatedAt:
      type: string
      format: date-time
      description: What the reconciliation sweep's ">15 minutes in PENDING" check measures from (`../../modules/payment.md` §6).
    resolvedAt:
      type: [string, 'null']
      format: date-time
      description: >-
        Non-null if and only if `status` has left `PENDING`
        (`database-schema.md` §5.1). Structurally enforced below via
        `if`/`then`/`else`, same technique as
        `../../api/schemas/registration.yaml#/Registration`'s
        `holdExpiresAt` — a clean two-way "iff" against the current
        `status` value.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  if:
    properties:
      status:
        const: PENDING
  then:
    properties:
      resolvedAt:
        type: 'null'
  else:
    required: [resolvedAt]
    properties:
      resolvedAt:
        type: string

PaymentStatus:
  type: string
  enum: [PENDING, SUCCEEDED, FAILED, CANCELLED]
  description: '`../../platform/database-schema.md` §5.1 / `../../modules/payment.md` §1.'

CreatePaymentChargeRequest:
  type: object
  description: >-
    **Body shape is inferred — flagged as an assumption.**
    `../../modules/payment.md` never specifies this request's fields beyond
    "every `POST /api/v1/payments/charge` request carries a client-generated
    `Idempotency-Key` header" (§8). `paymentMethodToken` is modeled as an
    opaque token from the gateway's own client-side SDK (e.g. Stripe.js),
    never raw card data — consistent with `architecture.md` §5.4's
    "credentials never in source or committed config" discipline extended
    to the standard PCI-scope-avoidance pattern of never letting card
    details reach the Backend API at all, though no document states this
    field explicitly. Revisit when a design note fixes the client-side
    payment-collection flow.
  required: [registrationId, paymentMethodToken]
  properties:
    registrationId:
      type: string
      format: uuid
      description: Must reference a `RESERVED` registration the caller owns (`../../modules/registration.md` §1) — a `PENDING`/other-status registration is a `409`.
    paymentMethodToken:
      type: string
      description: Opaque payment-method token from the gateway's client-side SDK. Never raw card data.
