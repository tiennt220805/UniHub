# overlays/dev: one API instance, no Postgres replica (reads go to the Master, as in docker-compose), the
# base's sizing. deployment-and-cicd.md §3.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  - name: backend-api
    count: 1
  - name: postgres-replica
    count: 0
configMapGenerator:
  - name: backend-api-config
    behavior: merge
    literals:
      # 0 replicas, so the replica datasource still needs a URL (D87): the Master.
      - UNIHUB_DATASOURCE_REPLICA_URL=jdbc:postgresql://postgres-master:5432/unihub
      # Phase 8 task 9.2: on this machine the gateway is reached by `kubectl port-forward` on 8443 (no sudo, e2e.sh,
      # check-mesh.sh). A presigned PUT is signed for the Host with its port, and the browser sends the page's own
      # Host, so the URL must carry :8443 or the upload goes to port 443 (nothing there) / fails SigV4.
      - UNIHUB_OBJECT_STORAGE_PUBLIC_ENDPOINT=https://unihub.local:8443
