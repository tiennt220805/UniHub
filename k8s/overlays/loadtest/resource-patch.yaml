# PROVISIONAL (D82, task 5.7): not measured on a cluster. The API's 1 Gi limit is what the base already has (an API
# process held 621 MiB under a 768 Mi limit in Docker, so a smaller limit is not safe); the Postgres numbers are smaller than the
# design document's 1000m/2Gi, which together with Istio and Prometheus/Grafana/Tempo do not fit 10 GB of Minikube.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: unihub
spec:
  template:
    spec:
      containers:
        - name: backend-api
          resources:
            requests: { cpu: 300m, memory: 512Mi }
            limits: { cpu: 1000m, memory: 1Gi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-master
  namespace: unihub
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { cpu: 1500m, memory: 1536Mi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-replica
  namespace: unihub
spec:
  template:
    spec:
      containers:
        - name: postgres
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { cpu: 1500m, memory: 1536Mi }
