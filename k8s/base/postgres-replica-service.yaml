# Mirrors the Master's headless Service. The Backend API's read datasource resolves reads against this name
# (overlays/loadtest) or against postgres-master (overlays/dev, no replica).
apiVersion: v1
kind: Service
metadata:
  name: postgres-replica
  namespace: unihub
  labels: { app: postgres-replica }
spec:
  clusterIP: None
  selector: { app: postgres-replica }
  ports:
    - { name: tcp-postgres, port: 5432, targetPort: tcp-postgres }
