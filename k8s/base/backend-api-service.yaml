# Only the API port. The management port (8081) is deliberately not here: no route, inside or outside the
# mesh, goes to /actuator through this Service (Prometheus scrapes the pod by its own address, Phase 7 Mục 6).
apiVersion: v1
kind: Service
metadata:
  name: backend-api-service
  namespace: unihub
  labels: { app: backend-api }
spec:
  selector: { app: backend-api }
  ports:
    - { name: http-api, port: 8080, targetPort: http }
