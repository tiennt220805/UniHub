# SMTP for the Notification module (SMTP host is required at start-up, D36): Mailpit accepts every message and
# keeps it, nothing is ever delivered (D86). Same image as docker-compose.yml. The web UI and its API are on 8025.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: unihub
  labels: { app: mailpit, app.kubernetes.io/part-of: unihub }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: { app: mailpit, app.kubernetes.io/part-of: unihub }
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.20.7
          ports:
            - { name: tcp-smtp, containerPort: 1025 }
            - { name: http-ui, containerPort: 8025 }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http-ui }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /livez, port: http-ui }
            periodSeconds: 10
            failureThreshold: 3
