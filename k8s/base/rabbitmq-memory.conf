# Mounted as /etc/rabbitmq/conf.d/30-memory.conf (Phase 7 checklist 10.1, attempt 2).
# RabbitMQ reads the memory it may use from the VM, not from the container's limit: its boot log said
# `total memory: 12529770496` and `rabbitmq-diagnostics status` computed a watermark of 5.01 GB for a container
# limited to 768 Mi, so the broker never raised its own alarm and the kernel killed it (OOMKilled, exit 137,
# measured 2026-11-07). The override makes the watermark 0.4 of the limit (about 307 MiB).
# Keep the number equal to `resources.limits.memory` of k8s/base/rabbitmq-deployment.yaml.
total_memory_available_override_value = 768MiB
