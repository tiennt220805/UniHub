# STRICT mTLS for the two workloads Prometheus scrapes (Phase 7 checklist D95, task 6.1) — a TIGHTENING of the
# namespace's PERMISSIVE `default`, not an exception to a STRICT one; it has no `portLevelMtls`. Found by running
# it (docs/testing/reports/phase-7-cluster-checks.md): Prometheus scrapes with the certificates of its own sidecar
# (observability/prometheus/prometheus.k8s.yml), and under PERMISSIVE Istio hands a TLS connection that does not
# carry its own ALPN straight to the application ("server gave HTTP response to HTTPS client"; the broker's port:
# connection reset). Only where the pod is STRICT is the connection terminated as mutual TLS. So the mTLS scrape
# of P4 cannot be shown before these two are STRICT.
#
# Superseded by task 7.5, which makes `default` STRICT for the whole namespace: delete this file then, so that
# the mode has one source. A workload-scoped policy overrides the namespace's, so this changes nothing the
# switch will not change, only earlier and only here.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: strict-backend-api
  namespace: unihub
spec:
  selector: { matchLabels: { app: backend-api } }
  mtls: { mode: STRICT }
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: strict-rabbitmq
  namespace: unihub
spec:
  selector: { matchLabels: { app: rabbitmq } }
  mtls: { mode: STRICT }
