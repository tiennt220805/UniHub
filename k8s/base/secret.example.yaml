# A committed TEMPLATE, never applied and never a source of real values. It is deliberately NOT in
# kustomization.yaml's `resources:` — leaving it out is what guarantees `kubectl apply -k` (any overlay) never
# creates a Secret whose values are the literal "<injected at runtime>". The real Secret comes only from
# k8s/scripts/create-secrets.sh (`make secrets`), which reads each value from the environment of whoever runs it
# (the ticket key from apps/backend/scripts/generate-ticket-key.sh) and runs `kubectl create secret generic
# backend-api-secrets -n unihub`; no value is ever written to a file that could be committed (D87).
# A static test (KubernetesManifestsTest) keeps this list equal to the keys create-secrets.sh writes and checks
# that every variable the application needs at start-up is here or in configmap's literals.
apiVersion: v1
kind: Secret
metadata:
  name: backend-api-secrets
  namespace: unihub
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "<injected at runtime>"
  SPRING_DATASOURCE_PASSWORD: "<injected at runtime>"
  UNIHUB_DATASOURCE_REPLICA_USERNAME: "<injected at runtime>"
  UNIHUB_DATASOURCE_REPLICA_PASSWORD: "<injected at runtime>"
  POSTGRES_USER: "<injected at runtime>"        # read by the postgres image and the replica's pg_basebackup (C57)
  POSTGRES_PASSWORD: "<injected at runtime>"
  POSTGRES_DB: "unihub"
  SPRING_RABBITMQ_USERNAME: "<injected at runtime>"
  SPRING_RABBITMQ_PASSWORD: "<injected at runtime>"
  UNIHUB_REDIS_PASSWORD: "<injected at runtime>"
  UNIHUB_SECURITY_JWT_SECRET: "<injected at runtime>"
  UNIHUB_PAYMENT_STRIPE_SECRETKEY: "<injected at runtime>"    # unihub.payment.stripe.secret-key; any value: the gateway is a stub
  # UNIHUB_PAYMENT_STRIPE_WEBHOOK_SECRET is deliberately absent on the cluster: with none, every payment webhook
  # is refused. The charge resolves from the synchronous confirm and the reconciliation sweep, so the stub needs
  # no signed webhook (D86).
  UNIHUB_OBJECT_STORAGE_ACCESS_KEY: "<injected at runtime>"
  UNIHUB_OBJECT_STORAGE_SECRET_KEY: "<injected at runtime>"
  UNIHUB_DEV_SEED_STUDENT_PASSWORD: "<injected at runtime>"    # the seeded accounts (user.md §10)
  # One password per staff role (user.md §10, task 5.8): an account of a role whose variable is unset is not seeded.
  UNIHUB_DEV_SEED_ORGANIZER_PASSWORD: "<injected at runtime>"
  UNIHUB_DEV_SEED_ADMIN_PASSWORD: "<injected at runtime>"
  UNIHUB_DEV_SEED_CHECKIN_STAFF_PASSWORD: "<injected at runtime>"
  UNIHUB_NOTIFICATION_SMTP_USERNAME: "<injected at runtime>"   # empty for Mailpit (D36)
  UNIHUB_NOTIFICATION_SMTP_PASSWORD: "<injected at runtime>"
  # Private EC P-256 JWK that signs QR e-tickets; required at start-up, read by the Registration module only
  # (checkin.md §4, D49). Rotation = replace + restart (break-glass).
  UNIHUB_TICKET_SIGNING_KEY: "<injected at runtime>"
  UNIHUB_AI_SUMMARIZATION_API_KEY: "<injected at runtime>"     # empty until a provider is chosen (D60)
