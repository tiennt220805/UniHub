# AI Summarization Service stub: WireMock answering POST /v1/summarize with a fixed summary (no provider is
# chosen, workshop.md §9, D60).
# Image = the WireMock version of the integration tests (build.gradle.kts), so a mapping that passes there behaves
# the same here. Mappings are a ConfigMap generated from stubs/ai-summarization/mappings.json.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-summarization-stub
  namespace: unihub
  labels: { app: ai-summarization-stub, app.kubernetes.io/part-of: unihub }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-summarization-stub }
  template:
    metadata:
      labels: { app: ai-summarization-stub, app.kubernetes.io/part-of: unihub }
    spec:
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.13.2
          args: ["--disable-banner"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: JAVA_OPTS, value: "-Xmx128m" }
          volumeMounts:
            - { name: mappings, mountPath: /home/wiremock/mappings, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: 500m, memory: 320Mi }
          readinessProbe:
            httpGet: { path: /__admin/health, port: http }
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /__admin/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: mappings
          configMap: { name: ai-summarization-stub-mappings }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-summarization-stub
  namespace: unihub
  labels: { app: ai-summarization-stub }
spec:
  selector: { app: ai-summarization-stub }
  ports:
    - { name: http, port: 8080, targetPort: http }
