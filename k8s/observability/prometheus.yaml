# Prometheus (task 6.1): finds the application's and the broker's pods by service discovery and scrapes them over
# mTLS with the certificates of its own sidecar (observability/prometheus/prometheus.k8s.yml explains the scrape).
# Image and flags are docker-compose's (v3.15.0, 2 days of retention, exemplar storage for the Tempo link).
# No volume claim: the data is a development convenience and is lost when the pod is replaced.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: unihub-observability
---
# Pod discovery reads the pods of `unihub` and nothing else: a Role in that namespace, not a ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-pod-discovery
  namespace: unihub
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-pod-discovery
  namespace: unihub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-pod-discovery
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: unihub-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: unihub-observability
  labels: { app: prometheus, app.kubernetes.io/part-of: unihub }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus, app.kubernetes.io/part-of: unihub }
      annotations:
        # The sidecar writes its workload certificate (root-cert.pem, cert-chain.pem, key.pem) to the volume below;
        # the same volume is mounted into the Prometheus container, which presents it when it scrapes.
        proxy.istio.io/config: |
          proxyMetadata:
            OUTPUT_CERTS: /etc/istio-output-certs
        sidecar.istio.io/userVolumeMount: '[{"name": "istio-certs", "mountPath": "/etc/istio-output-certs"}]'
        # The scrape speaks TLS itself, so these two ports must not also pass through Prometheus's sidecar (which
        # would treat the stream as opaque TCP or add a second layer). Every other connection of this pod
        # (Grafana reading it, its calls to the API server) stays in the mesh.
        traffic.sidecar.istio.io/excludeOutboundPorts: "8081,15692"
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --enable-feature=exemplar-storage
          ports:
            - { name: http-prometheus, containerPort: 9090 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
          readinessProbe:
            httpGet: { path: /-/ready, port: http-prometheus }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /-/healthy, port: http-prometheus }
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: istio-certs, mountPath: /etc/istio-certs, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: istio-certs
          emptyDir: { medium: Memory }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: unihub-observability
  labels: { app: prometheus, app.kubernetes.io/part-of: unihub }
spec:
  selector: { app: prometheus }
  ports:
    - { name: http-prometheus, port: 9090, targetPort: http-prometheus }
