# A committed TEMPLATE, never applied (like k8s/base/secret.example.yaml): NOT in kustomization.yaml's
# `resources:`. The real Secret comes only from k8s/scripts/create-observability-secret.sh (`make secrets`), which
# reads the password from the environment of whoever runs it or makes one up. KubernetesManifestsTest keeps this
# list equal to the keys that script writes.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: unihub-observability
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: "<injected at runtime>"
  GF_SECURITY_ADMIN_PASSWORD: "<injected at runtime>"
