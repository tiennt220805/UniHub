# Provisioned datasources (Phase 6 checklist 1.4, D63). The URLs are compose service names; the Phase 7
# ConfigMap overrides them with the cluster's service names. Fixed UIDs so dashboards, alert rules and the
# Prometheus-to-Tempo exemplar link (task 6.3) refer to a datasource by a name that never changes.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # A latency panel's exemplar (a sampled request) opens its trace in Tempo (Phase 6 checklist 6.3,
      # ADR Trace Backend). "trace_id" is the label the application's scrape puts on the exemplar:
      # ObservabilityProvisioningIT checks it against a real scrape.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
