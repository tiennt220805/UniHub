# Mounted into the compose broker as /etc/rabbitmq/conf.d/20-prometheus.conf (Phase 6 checklist 1.4, D63).
# The rabbitmq_prometheus plugin itself is already enabled in the rabbitmq:3.13.7-management image, so no
# enabled_plugins file is mounted (that would also have to list rabbitmq_management, or the UI on 15672 is lost).
#
# Without this the plugin returns aggregated series only. The Messaging & audit dashboard and the parking-lot
# alert need the depth of each queue by name (observability.md §4, §6). The broker has about twenty queues, so
# the extra series cost nothing here.
prometheus.return_per_object_metrics = true
