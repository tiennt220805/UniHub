name: CI

# Targets `main`: matches deployment-and-cicd.md §5's CI Job Structuring ADR model, and also matches
# this repo's actual practice — this is a solo project, so every Phase 1 commit lands directly on `main`
# (no pull requests) and not on the `phase-1-foundation` branch checklists/phase-1-foundation-checklist.md names
# as the working branch (that branch was only ever local, was abandoned at Mục 0.1 and has not moved
# since). `main` is therefore where CI needs to run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # spotlessCheck + checkstyleMain, per deployment-and-cicd.md §5's `lint` job model, plus
  # bundleApiContract (Mục 0.7) — not in that doc's model since it predates Mục 0.7, but it belongs
  # here: a fast, no-infrastructure syntax/`$ref` validation of packages/api-contract, same spirit as
  # the Checkstyle/Spotless checks already in this job, and already wired into Gradle's own `check`
  # alongside them. `test`/coverage stays out of `lint` — that is `unit-test`'s job below.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      # bundleApiContract shells out to `npx @redocly/cli` — pinned here rather than relying on
      # whatever Node version happens to be preinstalled on ubuntu-latest.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: ./gradlew spotlessCheck checkstyleMain bundleApiContract --no-daemon

  # test + jacocoTestCoverageVerification (Coverage Verification Mechanism ADR, deployment-and-cicd.md
  # §5) — Unit only, no Testcontainers/Docker (`integration-test` below is a separate job).
  unit-test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: ./gradlew test jacocoTestCoverageVerification --no-daemon

  # deployment-and-cicd.md §5's `integration-test` job. Testcontainers starts Postgres, Redis, RabbitMQ and
  # MinIO itself against the Docker daemon already present on ubuntu-latest — no `services:` stanza.
  integration-test:
    needs: unit-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: ./gradlew integrationTest --no-daemon

  # deployment-and-cicd.md §5 (Contract-Diff Mechanism ADR). All of the logic lives in the script, which a
  # developer runs unchanged locally (docs/testing/test-levels/contract-testing.md §2) — none of it is
  # repeated here. The script sets its own SPRING_DATASOURCE_URL default (generateOpenApiDocs needs a URL
  # to exist, not a database), cd's to apps/backend itself, and needs `jq` and Docker, both preinstalled on
  # ubuntu-latest.
  contract-diff:
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      # @redocly/cli 2.x needs Node >= 22.12 (or >= 20.19 < 21) — pinned here, not left to the
      # ubuntu-latest image's preinstalled version.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash apps/backend/scripts/contract-diff.sh
