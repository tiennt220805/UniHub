name: CI

# Targets `main`: matches deployment-and-cicd.md §5's CI Job Structuring ADR model, and also matches
# this repo's actual practice — this is a solo project, so every Phase 1 commit lands directly on `main`
# (no pull requests) and not on the `phase-1-foundation` branch checklists/phase-1-foundation.md names
# as the working branch (that branch was only ever local, was abandoned at Mục 0.1 and has not moved
# since). `main` is therefore where CI needs to run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # spotlessCheck + checkstyleMain, per deployment-and-cicd.md §5's `lint` job model, plus
  # bundleApiContract (Mục 0.7) — not in that doc's model since it predates Mục 0.7, but it belongs
  # here: a fast, no-infrastructure syntax/`$ref` validation of packages/api-contract, same spirit as
  # the Checkstyle/Spotless checks already in this job, and already wired into Gradle's own `check`
  # alongside them. `test`/coverage stays out of `lint` — that is `unit-test`'s job below.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      # bundleApiContract shells out to `npx @redocly/cli` — pinned here rather than relying on
      # whatever Node version happens to be preinstalled on ubuntu-latest.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: ./gradlew spotlessCheck checkstyleMain bundleApiContract --no-daemon

  # test + jacocoTestCoverageVerification (Coverage Verification Mechanism ADR, deployment-and-cicd.md
  # §5) — Unit only, no Testcontainers/Docker (`integration-test` below is a separate job).
  unit-test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: ./gradlew test jacocoTestCoverageVerification --no-daemon

  # deployment-and-cicd.md §5's `integration-test` job. Testcontainers starts Postgres, Redis, RabbitMQ and
  # MinIO itself against the Docker daemon already present on ubuntu-latest — no `services:` stanza.
  integration-test:
    needs: unit-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      # Full history: MigrationCompatibilityIT (INV-15, Phase 7 checklist D88) builds the application of the
      # commit before the newest migration from git history, and scripts/build-previous-release.sh refuses a
      # shallow clone (with one commit the "previous release" would be HEAD and the test would pass vacuously).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: ./gradlew integrationTest --no-daemon
      # Reports are kept even when the run is red (`if: always()`): the failing test's own output is the
      # evidence M-38 (`Flaky — investigate`) has been missing. Workflow artifacts, never committed
      # (test-strategy.md §6).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          path: |
            apps/backend/build/reports/tests
            apps/backend/build/test-results
            apps/backend/build/previous-release/logs
          retention-days: 14
          if-no-files-found: warn

  # The Web Application's gate (apps/web): types from the contract, typecheck, lint (oxlint + the ESLint
  # import-boundary rules of web-coding-standards.md §2) and Vitest. Independent of the backend chain
  # (`needs:` nothing): it needs no database, no Docker and no backend, so a red backend job neither hides
  # nor delays it, and it blocks nothing upstream. No `continue-on-error`: a failure fails the run.
  # schema.gen.ts is gitignored (web-coding-standards.md §5), so the types are generated first. Node 22:
  # Vite 8, jsdom and Vitest need >= 20.19 or >= 22.12, and the lockfile carries the linux-x64 native
  # binaries (rolldown, oxlint, tailwind oxide, lightningcss) `npm ci` installs here.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run api:types
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # The Check-in Client (apps/mobile, Phase 5 checklist D57, `docs/guidelines/mobile-coding-standards.md`).
  # Independent of the backend jobs like `web`: typecheck, lint, Jest (jest-expo, better-sqlite3 for the
  # durable-queue tests). No EAS build and no device here: the camera, Hermes and SecureStore are checked
  # by hand on a phone and recorded in the Phase 5 evidence. schema.gen.ts is gitignored, so the types are
  # generated first.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run api:types
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # deployment-and-cicd.md §5 (Contract-Diff Mechanism ADR). All of the logic lives in the script, which a
  # developer runs unchanged locally (docs/testing/test-levels/contract-testing.md §2) — none of it is
  # repeated here. The script sets its own SPRING_DATASOURCE_URL default (generateOpenApiDocs needs a URL
  # to exist, not a database), cd's to apps/backend itself, and needs `jq` and Docker, both preinstalled on
  # ubuntu-latest.
  contract-diff:
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      # @redocly/cli 2.x needs Node >= 22.12 (or >= 20.19 < 21) — pinned here, not left to the
      # ubuntu-latest image's preinstalled version.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash apps/backend/scripts/contract-diff.sh

  # Stage 5 (deployment-and-cicd.md §5; Phase 7 checklist Q23, D84, D85, D103): build both images for
  # linux/amd64 and linux/arm64 and push them to Docker Hub, tagged with the commit SHA (what the cluster
  # references) and `latest` (a convenience pointer only). No deployment step: deploying to Minikube is a
  # local Makefile action (CI/CD Automation Boundary ADR).
  #
  # `needs:` lists the three direct gates: contract-diff (which itself waits for lint, unit-test and
  # integration-test), Gitleaks (INV-18) and the Web job (the Web image is built here). A push to `main` is
  # the only event that gets this far: pull requests never run it, so they never see the Docker Hub secrets.
  build-and-push:
    needs: [contract-diff, secret-scan-gitleaks, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # The Docker Hub namespace the images live under. Not a secret: it is in every image name.
      DOCKERHUB_NAMESPACE: thanhtien2208
    steps:
      - uses: actions/checkout@v4
      # QEMU is only for the RUN steps of the runtime stage of the backend image (a user is created per
      # architecture). Both builder stages run on the runner's own architecture (--platform=$BUILDPLATFORM).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # provenance/sbom off: with them on, buildx adds an "unknown/unknown" attestation entry to the image
      # index, and AC84.1 expects the index to list exactly the two platforms.
      - id: backend
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/unihub-backend:${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/unihub-backend:latest
      # Repository root as context: the build generates its API types from packages/api-contract.
      # VITE_PAYMENT_TEST_MODE=true because the payment gateway in the cluster is a stub (D85); the image
      # offers the Stripe test-token dropdown and is not a production build.
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VITE_PAYMENT_TEST_MODE=true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/unihub-web:${{ github.sha }}
            ${{ env.DOCKERHUB_NAMESPACE }}/unihub-web:latest
      # The digests are the evidence for M-66 (and what the cluster must run, AC84.2): they go in the run's
      # summary. They are not secrets.
      - run: |
          {
            echo "### Images pushed for ${GITHUB_SHA}"
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`${DOCKERHUB_NAMESPACE}/unihub-backend:${GITHUB_SHA}\` | \`${{ steps.backend.outputs.digest }}\` |"
            echo "| \`${DOCKERHUB_NAMESPACE}/unihub-web:${GITHUB_SHA}\` | \`${{ steps.web.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- Security scans (deployment-and-cicd.md §5, Security Scan Jobs ADR) ----
  # Semgrep and Dependency-Check: `needs:` nothing and `continue-on-error: true` — they report on every
  # push/PR but gate nothing until promoted (the ADR's five conditions: triaged baseline, pinned image,
  # chosen severity threshold, stable period, and for Dependency-Check the NVD key + cache). Rule sets are
  # starting values. Reports are workflow artifacts, never committed (test-strategy.md §6).
  #
  # The three scanner images are pinned to the version `latest` resolved to on 2026-10-26 (same manifest
  # digest, so nothing changed when they were pinned): Semgrep 1.181.1, Dependency-Check 13.0.0, Gitleaks
  # v8.30.1. Raising a pin is a deliberate edit, so a scanner upgrade can no longer change a run by itself
  # (IMPLEMENTATION-READINESS.md D6). Pinning the images does not pin their rules: Semgrep still pulls its
  # registry rule sets and Dependency-Check the NVD data when they run.
  sast-semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.181.1 \
            semgrep scan --metrics=off --config p/java --config p/typescript \
            --config p/owasp-top-ten /src

  # Needs the NVD_API_KEY repository secret (Settings → Secrets and variables → Actions); without it the
  # NVD download is throttled and the job is slow or fails — harmless while it stays non-blocking.
  #
  # The NVD database (~400k CVE records) lives in the image's /usr/share/dependency-check/data and is
  # cached between runs (the ADR's promotion condition 5): the first run downloads all of it, every later
  # run restores the newest cache and fetches only what changed since. The cache key is per run so each
  # run saves a fresh copy; `restore-keys` picks the latest one. Saved even when the scan step fails, so
  # a long first download is never thrown away.
  dependency-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # The scan reads manifests and archives, and Gradle has no lockfile, so the backend's runtime
      # dependencies would not be scanned at all. The boot jar carries exactly those (as nested jars,
      # which the tool opens); building it needs the JDK and nothing else. Phase 4 checklist 9.3.
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: ./gradlew bootJar --no-daemon
        working-directory: apps/backend
      - uses: actions/cache/restore@v4
        with:
          path: dc-data
          key: dependency-check-nvd-${{ github.run_id }}
          restore-keys: dependency-check-nvd-
      # The container runs as its own non-root user; let it write into the runner-owned cache dir.
      - run: mkdir -p dc-data dc-report && chmod -R a+rwX dc-data dc-report
      - run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning::NVD_API_KEY secret is not set — the NVD download is heavily throttled"
          fi
          docker run --rm -v "$PWD:/src" -v "$PWD/dc-report:/report" \
            -v "$PWD/dc-data:/usr/share/dependency-check/data" owasp/dependency-check:13.0.0 \
            --scan /src --exclude "**/dc-data/**" --format HTML --format JSON --out /report \
            --nvdApiKey "$NVD_API_KEY"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: dc-data
          key: dependency-check-nvd-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: dc-report

  # INV-18 / M-13 — deployment-and-cicd.md §5 (Security Scan Jobs ADR), copied from its model. Runs in
  # parallel with the gate chain (`needs:` nothing) and is blocking: no `continue-on-error`, so a finding
  # fails the run. Full history (`fetch-depth: 0`): a secret committed and later deleted is still leaked.
  # A justified false positive goes in a committed, reviewed allowlist: `.gitleaksignore` lists exact
  # findings (commit:file:rule:line), so no rule is switched off. `build-and-push` `needs:` this job (Phase 7). The
  # image is pinned (v8.30.1, see the scanner note above): this job is blocking, so an upgrade of the
  # scanner must not be able to turn a run red on its own.
  secret-scan-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --redact --exit-code 1
