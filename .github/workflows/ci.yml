name: CI

# Targets `main`: matches deployment-and-cicd.md §5's CI Job Structuring ADR model, and also matches
# this repo's actual practice — this is a solo project, so every Phase 1 commit lands directly on `main`
# (no pull requests) and not on the `phase-1-foundation` branch checklists/phase-1-foundation.md names
# as the working branch (that branch was only ever local, was abandoned at Mục 0.1 and has not moved
# since). `main` is therefore where CI needs to run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # spotlessCheck + checkstyleMain, per deployment-and-cicd.md §5's `lint` job model, plus
  # bundleApiContract (Mục 0.7) — not in that doc's model since it predates Mục 0.7, but it belongs
  # here: a fast, no-infrastructure syntax/`$ref` validation of packages/api-contract, same spirit as
  # the Checkstyle/Spotless checks already in this job, and already wired into Gradle's own `check`
  # alongside them. `test`/coverage stays out of `lint` — that is `unit-test`'s job below.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      # bundleApiContract shells out to `npx @redocly/cli` — pinned here rather than relying on
      # whatever Node version happens to be preinstalled on ubuntu-latest.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: ./gradlew spotlessCheck checkstyleMain bundleApiContract --no-daemon

  # test + jacocoTestCoverageVerification (Coverage Verification Mechanism ADR, deployment-and-cicd.md
  # §5) — Unit only, no Testcontainers/Docker (`integration-test` below is a separate job).
  unit-test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: ./gradlew test jacocoTestCoverageVerification --no-daemon

  # deployment-and-cicd.md §5's `integration-test` job. Testcontainers starts Postgres, Redis, RabbitMQ and
  # MinIO itself against the Docker daemon already present on ubuntu-latest — no `services:` stanza.
  integration-test:
    needs: unit-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: ./gradlew integrationTest --no-daemon

  # deployment-and-cicd.md §5 (Contract-Diff Mechanism ADR). All of the logic lives in the script, which a
  # developer runs unchanged locally (docs/testing/test-levels/contract-testing.md §2) — none of it is
  # repeated here. The script sets its own SPRING_DATASOURCE_URL default (generateOpenApiDocs needs a URL
  # to exist, not a database), cd's to apps/backend itself, and needs `jq` and Docker, both preinstalled on
  # ubuntu-latest.
  contract-diff:
    needs: integration-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      # @redocly/cli 2.x needs Node >= 22.12 (or >= 20.19 < 21) — pinned here, not left to the
      # ubuntu-latest image's preinstalled version.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash apps/backend/scripts/contract-diff.sh

  # ---- Security scans (deployment-and-cicd.md §5, Security Scan Jobs ADR) ----
  # Semgrep and Dependency-Check: `needs:` nothing and `continue-on-error: true` — they report on every
  # push/PR but gate nothing until promoted (the ADR's five conditions: triaged baseline, pinned image,
  # chosen severity threshold, stable period, and for Dependency-Check the NVD key + cache). Rule sets are
  # starting values. Reports are workflow artifacts, never committed (test-strategy.md §6).
  sast-semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest \
            semgrep scan --metrics=off --config p/java --config p/typescript \
            --config p/owasp-top-ten /src

  # Needs the NVD_API_KEY repository secret (Settings → Secrets and variables → Actions); without it the
  # NVD download is throttled and the job is slow or fails — harmless while it stays non-blocking.
  #
  # The NVD database (~400k CVE records) lives in the image's /usr/share/dependency-check/data and is
  # cached between runs (the ADR's promotion condition 5): the first run downloads all of it, every later
  # run restores the newest cache and fetches only what changed since. The cache key is per run so each
  # run saves a fresh copy; `restore-keys` picks the latest one. Saved even when the scan step fails, so
  # a long first download is never thrown away.
  dependency-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: dc-data
          key: dependency-check-nvd-${{ github.run_id }}
          restore-keys: dependency-check-nvd-
      # The container runs as its own non-root user; let it write into the runner-owned cache dir.
      - run: mkdir -p dc-data dc-report && chmod -R a+rwX dc-data dc-report
      - run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning::NVD_API_KEY secret is not set — the NVD download is heavily throttled"
          fi
          docker run --rm -v "$PWD:/src" -v "$PWD/dc-report:/report" \
            -v "$PWD/dc-data:/usr/share/dependency-check/data" owasp/dependency-check:latest \
            --scan /src --exclude "**/dc-data/**" --format HTML --format JSON --out /report \
            --nvdApiKey "$NVD_API_KEY"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: dc-data
          key: dependency-check-nvd-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: dc-report

  # INV-18 / M-13 — deployment-and-cicd.md §5 (Security Scan Jobs ADR), copied from its model. Runs in
  # parallel with the gate chain (`needs:` nothing) and is blocking: no `continue-on-error`, so a finding
  # fails the run. Full history (`fetch-depth: 0`): a secret committed and later deleted is still leaked.
  # A justified false positive goes in a committed, reviewed allowlist: `.gitleaksignore` lists exact
  # findings (commit:file:rule:line), so no rule is switched off. `build-and-push` must `needs:` this job once it exists (Phase 7). The
  # image is `latest`, the ADR's accepted risk; pin it the first time an upgrade fails a run.
  secret-scan-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --exit-code 1
