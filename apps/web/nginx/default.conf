# Serving layer of the Web image (apps/web/Dockerfile; deployment-and-cicd.md §1; Phase 7 checklist D85).
# nginx-unprivileged listens on 8080 as a non-root user. The Web is served from the same origin as the
# API: the Istio gateway sends /api/** to the Backend API and everything else here, so there is no proxy
# block and no CORS.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # The Content-Security-Policy as an HTTP header: the build's <meta> policy (vite-plugins/csp.ts, with
    # VITE_API_BASE_URL empty) plus `frame-ancestors 'none'`, which a <meta> tag cannot carry.
    # vite-plugins/__tests__/nginx-csp.test.ts fails if this line and buildCsp() drift apart.
    #
    # `add_header` is set here and in no `location` on purpose: a location that sets any add_header of its
    # own drops every one inherited from this level. `always` puts the header on 404 and 5xx responses too.
    # Cache headers below use `expires`, which does not count.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Liveness/readiness target for the Pod (nothing to check beyond "nginx answers").
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite's output names every file under assets/ by content hash: safe to cache for a year. A missing
    # file is a 404, never the app shell (a stale chunk name must not be answered with HTML).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Every other path is a client-side route: serve the shell, never cache it.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
