# DEV ONLY — not a deployment deliverable (K8s/Minikube per docs/requirement.md is the real target;
# see docs/technical-design/platform/deployment-and-cicd.md §2 for the Kustomize base that actually ships).
# Developer convenience only, outside Kustomize's scope (deployment-and-cicd.md §6's Environment Matrix).
#
# Deliberately separate from Testcontainers (docs/testing/test-levels/integration-testing.md §1):
# `./gradlew test`/`integrationTest` never read this file, this stack is never started by Gradle, and the
# explicit `name:` below keeps this project's containers/volumes/network out of Testcontainers' own
# (auto-generated, hash-named) namespace — no port, name, or volume this file creates is ever reused by it.
#
# Images match what integration-testing.md §2's IntegrationTestSupport (Testcontainers) and the Kustomize
# base (deployment-and-cicd.md §2) both pull, so a schema/behavior difference is never just "which
# environment you're running against" (deployment-and-cicd.md §6's cross-environment guarantee):
# postgres:16-alpine, redis:7, rabbitmq:3.13.7-management (pinned to the exact version: the broker's
# consumer_timeout, 30 minutes on this one, bounds a notification fan-out — Phase 4 checklist D36, D39),
# plus Mailpit (an SMTP catcher, a test double, never a production component). No `latest` tag anywhere.
#
# The observability stack (Prometheus, Grafana, Tempo; Phase 6 checklist D63) is also here. Their configuration
# is not: it lives in observability/ at the repository root (scrape config, datasources, dashboards, alert rules,
# Tempo) and is mounted read-only, because Phase 7 builds its ConfigMaps from the same files. Grafana has no
# password anywhere in the repository (AC63.2), and compose cannot require one from the environment without
# refusing the whole file for everyone who does not run Grafana. So: anyone who opens http://127.0.0.1:3000 is an
# anonymous Viewer (Grafana 13 supports no other anonymous role), which is all the provisioned dashboards and
# alert rules need; the admin account is Grafana's own built-in one (admin/admin, with a prompt to change the password at
# the first login that can be skipped: change it if the port is ever reachable by anyone else). Like every port in this file, Grafana is bound to 127.0.0.1: never publish it on another interface.
#
# Usage: `docker compose up -d` works with zero setup (every var below has a dev-only default). To
# override, copy env.example to .env (git-ignored, never committed — see apps/backend/.gitignore) and set
# your own local-only values; .env is picked up by `docker compose` automatically. The defaults here are
# throwaway dev values, never anything meant to protect real data.
name: unihub-dev

services:
  postgres:
    # Single instance — local dev deliberately collapses Master+Replica into one container; only the K8s
    # Kustomize base runs a Master + streaming Replica (deployment-and-cicd.md §2/§3's overlays/loadtest).
    image: postgres:16-alpine
    container_name: unihub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unihub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unihub_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-unihub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - unihub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unihub} -d ${POSTGRES_DB:-unihub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: unihub-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - unihub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: unihub-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-unihub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-unihub_dev_only}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      # rabbitmq_prometheus is already enabled in this image; Prometheus reads it inside the compose network
      # (rabbitmq:15692). Published for a human with curl as well.
      - "127.0.0.1:${RABBITMQ_PROMETHEUS_PORT:-15692}:15692"
    volumes:
      # Per-queue series (queue depth by name) for the dashboards and the parking-lot alert.
      - ../../observability/rabbitmq/prometheus.conf:/etc/rabbitmq/conf.d/20-prometheus.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP catcher for the EMAIL channel (notification.md §2): accepts every message, keeps it, shows it in a
  # web UI and an HTTP API. Nothing is ever delivered. Point the backend at it with
  # UNIHUB_NOTIFICATION_SMTP_HOST=127.0.0.1 (port 1025). The backend also needs UNIHUB_TICKET_SIGNING_KEY,
  # which is not a container: make one with scripts/generate-ticket-key.sh (see env.example).
  mailpit:
    image: axllent/mailpit:v1.20.7
    container_name: unihub-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # Object storage for brochure PDFs (workshop.md §4: MinIO stands in for AWS S3 everywhere except the PoC
  # deployment; only the endpoint differs). The bucket (`unihub-brochures`) is created by the backend at
  # start-up when unihub.object-storage.create-bucket is true (local runs and tests set it; a deployed
  # environment never does). The credentials are dev-only defaults, like Postgres and RabbitMQ above.
  # Pinned by digest, not by tag: minio/minio is no longer published on Docker Hub, and the Chainguard
  # build used by the integration tests (IntegrationTestSupport) only has a `latest` tag. Digest of
  # RELEASE.2026-09-22T19-25-18Z, built 2026-09-30.
  minio:
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    container_name: unihub-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-unihub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-unihub_dev_only}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - unihub-minio-data:/data
    # No healthcheck: this image has no shell, no curl and no `mc`. MinIO answers on :9000 within a second.

  # Metrics (observability.md §4, §6, §8). Scrapes the backend on the host (host.docker.internal:8081, the
  # management port) and the broker. Versions: v3.15.0 (2026-09-25) is the newest release more than two weeks old
  # when it was chosen (v3.15.1 is dated 2026-10-21). 2 days of retention: a developer tool, not a record.
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: unihub-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    # host.docker.internal resolves on Docker Desktop; on Linux this line makes it resolve too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../../observability/prometheus/prometheus.compose.yml:/etc/prometheus/prometheus.yml:ro
      - unihub-prometheus-data:/prometheus

  # Traces, OTLP over HTTP (4318, what the backend's exporter speaks) and the query API (3200, read by Grafana).
  # Monolithic mode, local disk. 2.10.8 (2026-08-13): the 3.x line moves ingestion onto a Kafka-compatible
  # broker, which a one-process developer stack has no use for. Tempo is only reached when
  # MANAGEMENT_OTLP_TRACING_ENDPOINT is set on the backend (env.example); without it the backend exports nothing.
  tempo:
    image: grafana/tempo:2.10.8
    container_name: unihub-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    volumes:
      - ../../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - unihub-tempo-data:/var/tempo

  # Dashboards and alert rules, all provisioned from observability/ (nothing is saved in the container, and the
  # provisioned dashboards cannot be edited in the UI). 13.2.4 (2026-10-13) is the newest 13.2 patch release more
  # than two weeks old (13.2.5 is dated 2026-10-27). Anonymous Viewer only, on 127.0.0.1: see the header.
  grafana:
    image: grafana/grafana:13.2.4
    container_name: unihub-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana 13 otherwise downloads plugin updates (it tried Tempo 13.2.4 -> 13.4.1) at every start: the
      # datasource then answers "plugin not registered" until that finishes, and an offline run never does.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo

volumes:
  unihub-postgres-data:
  unihub-redis-data:
  unihub-minio-data:
  unihub-prometheus-data:
  unihub-tempo-data:
