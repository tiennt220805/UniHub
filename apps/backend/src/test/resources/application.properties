# Unit-test slices (@WebMvcTest) load the real SecurityConfig but none of the application's use cases, so the
# rate limiter (which needs ConsumeRateLimitBudgetUseCase) is off in them. It is covered by RateLimitGateTest
# (the gate and the filters, with an in-memory budget) and, against a real Redis, by RateLimitIT and the
# multi-instance limiter tests (Phase 7 checklist 3.3–3.5).
unihub.rate-limit.enabled=false
