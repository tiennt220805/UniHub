# INV-15 (architecture.md §6.2): schema migration runs exactly once, from a single place, before any
# application instance starts — never from inside the application itself. Locally that place is
# `./gradlew flywayMigrate` (build.gradle.kts); in Kubernetes it's the flyway-migrate Job
# (docs/technical-design/platform/deployment-and-cicd.md §4). Spring Boot's own migrate-on-startup is
# neither of those, so it stays disabled here. There is no DataSource yet for this flag to actually gate
# (Mục 2 adds one) — set now so it isn't accidentally left enabled (or omitted) once one exists.
spring:
  flyway:
    enabled: false

  # Hibernate backs the Tier A persistence adapters (backend-coding-standards.md §9.2). It never touches
  # the schema: Flyway owns DDL (INV-15), so ddl-auto is pinned to none instead of left to a default.
  # open-in-view is off — a lazy load must never reach into the web layer. Hibernate is also told the
  # dialect and forbidden JDBC metadata access, so booting the app (contract-diff's generateOpenApiDocs)
  # does not need a listening database: nothing connects until a query runs.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false

  # The scheduler's default pool is one thread, shared by every job. The outbox relay can wait up to the
  # confirm timeout per message, so a single thread would let one slow cycle stall the nightly sync and
  # both cleanup sweeps. Four covers the four jobs; each is already serialized by its own job lock.
  task:
    scheduling:
      pool:
        size: 4

  # RabbitMQ (messaging.md §1, backend-coding-standards.md §8.6). Host, port and credentials come from the
  # environment only (SPRING_RABBITMQ_*) — never set here (M-13). Confirms are what lets the outbox relay mark a
  # row PUBLISHED; returns plus mandatory make an unroutable message a failure instead of a silent discard.
  # default-requeue-rejected=false: business queues have no dead-letter exchange, so a failed message is
  # republished to its retry chain by the shared recoverer (never by a broker reject).
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

# packages/api-contract is OpenAPI 3.1; springdoc 2.6.0 defaults to 3.0.x. Pinned so the spec
# `generateOpenApiDocs` produces (contract-testing.md §2) is the same dialect as the hand-written one —
# otherwise `openAPI: 3.1.0 vs 3.0.1` alone fails contract-diff.
springdoc:
  api-docs:
    version: openapi_3_1

# Read/write splitting (architecture.md §4.1, backend-coding-standards.md §20). The Master is
# spring.datasource.*; the Replica is unihub.datasource.replica.{url,username,password}, injected from the
# environment only (UNIHUB_DATASOURCE_REPLICA_URL, ..._USERNAME, ..._PASSWORD) — never set here (M-13).
# Left unset, read-only transactions use the Master pool: local dev and overlays/dev run no Replica
# (deployment-and-cicd.md §3). Username/password default to the Master's.

# Nightly legacy student sync (docs/technical-design/modules/user.md §2, §7). Off by default in every
# environment: Phase 1 runs a single instance and the job lock is still in-process (InProcessJobLock,
# INV-09 is Phase 3), so turning the trigger on is a deliberate per-environment choice
# (UNIHUB_JOBS_NIGHTLYSYNC_ENABLED=true). The rest are the documented values.
unihub:
  jobs:
    nightly-sync:
      enabled: false
      cron: "0 0 2 * * *"
      zone: Asia/Ho_Chi_Minh
      inbound-dir: /var/unihub/legacy-sync/inbound
      batch-size: 500
    # Idempotency-key sweep (distributed-coordination.md §2, database-schema.md §8.1). On by default: a
    # duplicate run only finds nothing left to delete. retention is measured from completed_at and must
    # cover the 15-minute seat hold plus a client retry margin (Phase 2 checklist 1.2, 2026-10-16); only
    # COMPLETED keys are ever deleted. interval is the pause between sweeps.
    idempotency-cleanup:
      enabled: true
      interval: PT1M
      retention: PT30M
    # Outbox relay (messaging.md §5). On by default: without it no event leaves event_publications.
    # One cycle per interval (fixedDelay, so cycles never overlap), at most batch-size rows each.
    outbox-relay:
      enabled: true
      interval: PT1S
      batch-size: 200
    # Published-row sweep (distributed-coordination.md §2, database-schema.md §8.2). retention is measured
    # from published_at (decided 2026-10-16); only PUBLISHED rows are ever deleted.
    event-publication-cleanup:
      enabled: true
      interval: PT1M
      retention: PT1H
  # Seat reservation (registration.md §2, Phase 2 checklist D3/D4). seat-hold is how long a paid
  # registration keeps its seat; lock-wait/lock-lease are the per-workshop seat lock (the in-process
  # adapter ignores the lease); seat-claim-attempts is how many transactions a claim may lose to a
  # workshops.version race before it answers 503.
  registration:
    seat-hold: PT15M
    lock-wait: PT2S
    lock-lease: PT5S
    seat-claim-attempts: 3
  # Payment Gateway (payment.md §3). The Stripe sandbox secret key is never set here: it comes from
  # the environment (UNIHUB_PAYMENT_STRIPE_SECRET_KEY), and with none there is no gateway bean.
  # api-base, connect-timeout and read-timeout exist for tests; the timeouts may not exceed 3s.
  # The webhook signing secret likewise comes only from the environment
  # (UNIHUB_PAYMENT_STRIPE_WEBHOOK_SECRET); with none, every payment webhook is refused. The
  # signature timestamp must be within unihub.payment.stripe.webhook.tolerance (default PT5M).
  # How long a publish waits for the broker's confirm before the message counts as not delivered.
  messaging:
    confirm-timeout: PT5S
  # Redis (distributed-coordination.md §1). The address and password come from the environment only
  # (UNIHUB_REDIS_ADDRESS, UNIHUB_REDIS_PASSWORD) — never set here (M-13). With no address there is no Redis
  # client at all: the workshop catalog is simply not cached and every read goes to the database. Timeouts
  # are short on purpose: an unreachable Redis must cost a request milliseconds, not seconds.
  redis:
    connect-timeout: PT0.5S
    command-timeout: PT0.5S
