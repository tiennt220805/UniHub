# INV-15 (architecture.md §6.2): schema migration runs exactly once, from a single place, before any
# application instance starts — never from inside the application itself. Locally that place is
# `./gradlew flywayMigrate` (build.gradle.kts); in Kubernetes it's the flyway-migrate Job
# (docs/technical-design/platform/deployment-and-cicd.md §4). Spring Boot's own migrate-on-startup is
# neither of those, so it stays disabled here. There is no DataSource yet for this flag to actually gate
# (Mục 2 adds one) — set now so it isn't accidentally left enabled (or omitted) once one exists.
spring:
  flyway:
    enabled: false

  # Hibernate backs the Tier A persistence adapters (backend-coding-standards.md §9.2). It never touches
  # the schema: Flyway owns DDL (INV-15), so ddl-auto is pinned to none instead of left to a default.
  # open-in-view is off — a lazy load must never reach into the web layer. Hibernate is also told the
  # dialect and forbidden JDBC metadata access, so booting the app (contract-diff's generateOpenApiDocs)
  # does not need a listening database: nothing connects until a query runs.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false

  # The scheduler's default pool is one thread, shared by every job. The outbox relay can wait up to the
  # confirm timeout per message, so a single thread would let one slow cycle stall the nightly sync and
  # both cleanup sweeps. Four covers the four jobs; each is already serialized by its own job lock.
  task:
    scheduling:
      pool:
        size: 4

  # RabbitMQ (messaging.md §1, backend-coding-standards.md §8.6). Host, port and credentials come from the
  # environment only (SPRING_RABBITMQ_*) — never set here (M-13). Confirms are what lets the outbox relay mark a
  # row PUBLISHED; returns plus mandatory make an unroutable message a failure instead of a silent discard.
  # default-requeue-rejected=false: business queues have no dead-letter exchange, so a failed message is
  # republished to its retry chain by the shared recoverer (never by a broker reject).
  rabbitmq:
    # A broker that does not answer a channel RPC (opening a channel for the next publish) in this
    # time is as unhealthy as one that does not confirm: the default is 10 minutes, far past the
    # relay's 30 s lease (messaging.md §5, Phase 4 checklist D42, 7.4).
    channel-rpc-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false

# Actuator (observability.md §5, §8; Phase 6 checklist D64). It runs on its own management port, never on the
# API port, so no Ingress route can reach /actuator/**: only `health` and `prometheus` are exposed, and the
# management chain permits both without a token (ManagementSecurityConfig). Tests set the port to 0.
#
# The auto-configured `db`, `rabbit` and `mail` indicators are off because the project writes its own:
# `db` must see the Master only (the Replica is a routing target, INV-03), `redis` does not exist in Boot
# for a plain Redisson client, `rabbit` must answer inside a hard timeout and report DEGRADED instead of
# DOWN, and `mail` would open an SMTP connection on every probe. `readiness` therefore asks only the
# Master; `dependencies` is informational and never a probe (Readiness Composition ADR), so a Redis or
# RabbitMQ outage shows there as DEGRADED with HTTP 200 and never takes a pod out of rotation.
#
# Tracing: Micrometer Tracing bridged to OpenTelemetry. The trace ID is the correlation ID (D65), so it
# must exist for every request, sampled or not; sampling only decides what is exported. The OTLP endpoint is
# never set here: management.otlp.tracing.endpoint (MANAGEMENT_OTLP_TRACING_ENDPOINT) comes from the
# environment, and without it Boot 3.3 builds no exporter, so nothing tries to send a trace.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      # Names and statuses of the components, never their details: the port is internal, but a probe
      # reading "readiness" should still see which part is down.
      show-components: always
      status:
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DEGRADED: 200
      group:
        readiness:
          include: readinessState,db
        dependencies:
          include: redis,rabbit
          show-details: always
  health:
    db:
      enabled: false
    rabbit:
      enabled: false
    mail:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 0.10

# packages/api-contract is OpenAPI 3.1; springdoc 2.6.0 defaults to 3.0.x. Pinned so the spec
# `generateOpenApiDocs` produces (contract-testing.md §2) is the same dialect as the hand-written one —
# otherwise `openAPI: 3.1.0 vs 3.0.1` alone fails contract-diff.
springdoc:
  api-docs:
    version: openapi_3_1

# Read/write splitting (architecture.md §4.1, backend-coding-standards.md §20). The Master is
# spring.datasource.*; the Replica is unihub.datasource.replica.{url,username,password}, injected from the
# environment only (UNIHUB_DATASOURCE_REPLICA_URL, ..._USERNAME, ..._PASSWORD) — never set here (M-13).
# Left unset, read-only transactions use the Master pool: local dev and overlays/dev run no Replica
# (deployment-and-cicd.md §3). Username/password default to the Master's.

# Nightly legacy student sync (docs/technical-design/modules/user.md §2, §7). Off by default in every
# environment: turning the trigger on is a deliberate per-environment choice
# (UNIHUB_JOBS_NIGHTLYSYNC_ENABLED=true); the job lock is the Redis one, so only one instance runs it. The rest are the documented values.
unihub:
  jobs:
    nightly-sync:
      enabled: false
      cron: "0 0 2 * * *"
      zone: Asia/Ho_Chi_Minh
      inbound-dir: /var/unihub/legacy-sync/inbound
      batch-size: 500
    # Idempotency-key sweep (distributed-coordination.md §2, database-schema.md §8.1). On by default: a
    # duplicate run only finds nothing left to delete. retention is measured from completed_at and must
    # cover the 15-minute seat hold plus a client retry margin (Phase 2 checklist 1.2, 2026-10-16); only
    # COMPLETED keys are ever deleted. interval is the pause between sweeps.
    idempotency-cleanup:
      enabled: true
      interval: PT1M
      retention: PT30M
    # Outbox relay (messaging.md §5). On by default: without it no event leaves event_publications.
    # One cycle per interval (fixedDelay, so cycles never overlap), at most batch-size rows each.
    outbox-relay:
      enabled: true
      interval: PT1S
      batch-size: 200
    # Payment reconciliation sweep (payment.md §6, distributed-coordination.md §2). On by default: it is
    # the guarantee of last resort for a payment the webhook never resolved, and a duplicate run only
    # requests payments the consumer then finds resolved. interval is the pause between sweeps; what
    # counts as stale is unihub.payment.reconciliation.stale-after below.
    payment-reconciliation:
      enabled: true
      interval: PT15M
    # Published-row sweep (distributed-coordination.md §2, database-schema.md §8.2). retention is measured
    # from published_at (decided 2026-10-16); only PUBLISHED rows are ever deleted.
    event-publication-cleanup:
      enabled: true
      interval: PT1M
      retention: PT1H
  # Seat reservation (registration.md §2, Phase 2 checklist D3/D4). seat-hold is how long a paid
  # registration keeps its seat; lock-wait/lock-lease are the per-workshop seat lock (Redis, fixed
  # lease, no watchdog); seat-claim-attempts is how many transactions a claim may lose to a
  # workshops.version race before it answers 503.
  registration:
    seat-hold: PT15M
    lock-wait: PT2S
    lock-lease: PT5S
    seat-claim-attempts: 3
  # Payment Gateway (payment.md §3). The Stripe sandbox secret key is never set here: it comes from
  # the environment (UNIHUB_PAYMENT_STRIPE_SECRET_KEY), and with none there is no gateway bean.
  # api-base, connect-timeout and read-timeout exist for tests; the timeouts may not exceed 3s.
  # The webhook signing secret likewise comes only from the environment
  # (UNIHUB_PAYMENT_STRIPE_WEBHOOK_SECRET); with none, every payment webhook is refused. The
  # signature timestamp must be within unihub.payment.stripe.webhook.tolerance (default PT5M).
  # Payment reconciliation (payment.md §6). stale-after: how long a payment may stay PENDING before the
  # sweep takes it (docs/requirement.md §2.10); batch-size: how many one sweep takes; stuck-after: how long
  # the gateway may keep a payment "processing" before an operator is told (Stripe's idempotency-key window).
  payment:
    # The one circuit breaker of every gateway call (payment.md §2, §3, §5; checklist D12, D17). These are
    # the documented values; a test lowers minimum-number-of-calls and the open state to make it quick.
    # sync-time-limit applies to each of the charge's two calls, async-time-limit to each call
    # reconciliation makes; async-retry-attempts counts the first call plus its retries (the status read only).
    breaker:
      window-size: 20
      failure-rate-threshold: 50
      wait-duration-in-open-state: PT30S
      permitted-calls-in-half-open-state: 5
      minimum-number-of-calls: 10
      sync-time-limit: PT3S
      async-time-limit: PT10S
      async-retry-attempts: 4
      async-retry-backoff: PT1S
    reconciliation:
      stale-after: PT15M
      batch-size: 500
      stuck-after: PT24H
  # How long a publish waits for the broker's confirm before the message counts as not delivered.
  messaging:
    confirm-timeout: PT5S
  # Redis (distributed-coordination.md §1). The address and password come from the environment only
  # (UNIHUB_REDIS_ADDRESS, UNIHUB_REDIS_PASSWORD) — never set here (M-13). The address is required: without
  # it the application does not start, because the seat lock and the job lock have no in-process fallback
  # (Phase 3 checklist D21). An address that is set but unreachable still starts the application; registrations
  # are then refused with 503. Timeouts are short on purpose: an unreachable Redis must cost a request
  # milliseconds, not seconds.
  redis:
    connect-timeout: PT0.5S
    command-timeout: PT0.5S
  # Notification (notification.md §2-§4, Phase 4 checklist D32-D39). The SMTP host is required and comes from
  # the environment (UNIHUB_NOTIFICATION_SMTP_HOST, and _PORT, _USERNAME, _PASSWORD for the rest) — never set
  # here (M-13): without it the application does not start. claim-lease is the send lease of one row, longer
  # than the worst case of one send (about 85s: 5s connect + 8 round trips at the 10s timeouts) and well under
  # the retry chain's total delay (about 5.6 minutes). channels lists, per type, the channels it is sent
  # through; a type left out uses EMAIL and IN_APP. listener is the notification queue's own container (D39).
  notification:
    claim-lease: PT120S
    display-zone: Asia/Ho_Chi_Minh
    smtp:
      connect-timeout: PT5S
      read-timeout: PT10S
      write-timeout: PT10S
    listener:
      concurrency: 2
      prefetch: 1
    channels:
      registration-confirmed: EMAIL,IN_APP
      workshop-cancelled: EMAIL,IN_APP
      workshop-rescheduled: EMAIL,IN_APP
  # QR e-ticket signing (checkin.md §4, Phase 5 checklist D49). The private EC P-256 JWK is never set here: it
  # comes from the environment only (UNIHUB_TICKET_SIGNING_KEY, a Kubernetes Secret in a deployed environment).
  # It is required: a blank, non-JWK, non-P-256 or public-only value stops the application at start with a
  # message that says what to set (and never prints the value). Make a local one with
  # scripts/generate-ticket-key.sh. Rotating it invalidates every ticket ever issued (checkin.md §6).
  ticket:
    signing-key:
  # Where the Web Application lives, for links in emails ("My registrations"). Not a secret.
  web:
    base-url: http://localhost:5173
