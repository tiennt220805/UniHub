# INV-15 (architecture.md §6.2): schema migration runs exactly once, from a single place, before any
# application instance starts — never from inside the application itself. Locally that place is
# `./gradlew flywayMigrate` (build.gradle.kts); in Kubernetes it's the flyway-migrate Job
# (docs/technical-design/platform/deployment-and-cicd.md §4). Spring Boot's own migrate-on-startup is
# neither of those, so it stays disabled here. There is no DataSource yet for this flag to actually gate
# (Mục 2 adds one) — set now so it isn't accidentally left enabled (or omitted) once one exists.
spring:
  flyway:
    enabled: false

# packages/api-contract is OpenAPI 3.1; springdoc 2.6.0 defaults to 3.0.x. Pinned so the spec
# `generateOpenApiDocs` produces (contract-testing.md §2) is the same dialect as the hand-written one —
# otherwise `openAPI: 3.1.0 vs 3.0.1` alone fails contract-diff.
springdoc:
  api-docs:
    version: openapi_3_1
