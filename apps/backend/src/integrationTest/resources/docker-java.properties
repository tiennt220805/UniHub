# Works around docker-java (bundled by Testcontainers, incl. 2.x) failing strategy resolution against
# recent Docker Engine/Docker Desktop builds on Windows: without this, DockerClientProviderStrategy gets a
# BadRequestException with an empty/default-valued Info body from /info (observed against Docker Desktop
# 4.55.0 / Engine 29.1.3 / API 1.52, min 1.44) instead of the classic "client version too old" message, but
# the fix is the same — pin the negotiated API version explicitly instead of relying on docker-java's
# auto-negotiation. Community-confirmed workaround:
# https://github.com/testcontainers/testcontainers-java/issues/11210#issuecomment-3516027863
#
# Why this keeps happening: Docker Engine 29.x raised its minimum supported client API version to 1.44
# (from 1.24); docker-java's own auto-negotiation against a fresh connection doesn't reliably land on a
# version at or above that floor on this Windows/Docker Desktop combination, so it must be told explicitly.
# 1.44 was chosen because it's the documented floor Docker Engine 29.x itself requires, not because
# anything here depends on 1.44-specific API behavior.
#
# Removal condition: delete this file once a `./gradlew integrationTest` run against the then-current
# Docker Desktop for Windows succeeds WITHOUT it (re-test by temporarily renaming the file, not by
# assuming a Testcontainers/docker-java changelog entry alone fixed it) — most likely after a docker-java
# release that negotiates the API version reliably against Docker Engine 29.x+ on Windows, or after
# upgrading past the currently-affected Docker Desktop version.
api.version=1.44
