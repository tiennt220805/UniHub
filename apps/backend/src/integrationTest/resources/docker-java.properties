# Works around docker-java (bundled by Testcontainers, incl. 2.x) failing strategy resolution against
# recent Docker Engine/Docker Desktop builds on Windows: without this, DockerClientProviderStrategy gets a
# BadRequestException with an empty/default-valued Info body from /info (observed against Docker Desktop
# 4.55.0 / Engine 29.1.3 / API 1.52, min 1.44) instead of the classic "client version too old" message, but
# the fix is the same — pin the negotiated API version explicitly instead of relying on docker-java's
# auto-negotiation. Community-confirmed workaround:
# https://github.com/testcontainers/testcontainers-java/issues/11210#issuecomment-3516027863
api.version=1.44
