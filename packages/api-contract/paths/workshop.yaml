WorkshopIdParam:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid

workshops:
  get:
    operationId: listWorkshops
    summary: Browse/search the workshop catalog
    description: >-
      `docs/requirement.md` §1.3.1: browse by schedule, search/filter by
      topic, speaker, or location. Public — no authentication required.
      Returns only `PUBLISHED` workshops; `DRAFT`/`CANCELLED`/`COMPLETED`
      rows never appear here regardless of caller. Backed by
      `../../../docs/technical-design/modules/workshop.md` §2's `unihub:cache:workshop:list:{filterHash}`
      cache key (30s TTL, natural-expiry-only staleness — accepted per that
      section's own trade-off).
    tags: [Workshop]
    security: []
    parameters:
      - name: q
        in: query
        required: false
        description: Free-text match against title/description ("topic" per `docs/requirement.md` §1.3.1).
        schema:
          type: string
      - name: speaker
        in: query
        required: false
        schema:
          type: string
      - name: location
        in: query
        required: false
        schema:
          type: string
      - name: dateFrom
        in: query
        required: false
        description: >-
          Must not be after `dateTo` when both are supplied. Not
          structurally enforced: unlike a request body, `dateFrom` and
          `dateTo` are two independent OpenAPI Parameter Objects, each with
          its own `schema` — there's no `if`/`then`/`else` (or any other
          JSON Schema mechanism) that reaches across separate `parameters`
          entries the way it can reach across two properties of the same
          object (see `CreateWorkshopRequest.startTime`/`endTime` and
          `isPaid`/`price` for that technique applied where the fields
          *are* siblings in one schema). Expressing this structurally would
          require restructuring both into one `style: deepObject` query
          parameter backed by a single object schema — a bigger surface
          change than this catalog-filter feature calls for. Enforced at
          the application layer instead; a violation is a `400` below.
        schema:
          type: string
          format: date-time
      - name: dateTo
        in: query
        required: false
        description: >-
          Must not be before `dateFrom` when both are supplied — see
          `dateFrom`'s description for why this ordering isn't structurally
          enforced across the two parameters.
        schema:
          type: string
          format: date-time
      - $ref: '../common/pagination.yaml#/PageParam'
      - $ref: '../common/pagination.yaml#/SizeParam'
    responses:
      '429':
        $ref: '../common/responses.yaml#/TooManyRequests'
      '200':
        description: Paginated catalog results.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/workshop.yaml#/WorkshopListResponse'
      '400':
        description: Invalid query parameters (e.g. `dateFrom` after `dateTo`, `size` above the cap).
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
  post:
    operationId: createWorkshop
    summary: Create a workshop (lands in DRAFT)
    description: >-
      `docs/requirement.md` §1.3.3: "full rights to create... workshops."
      Result is `DRAFT` (`database-schema.md` §3.1 default) — a separate
      `publish` call (below) is required before students can see it via
      `GET /workshops`.
    tags: [Workshop]
    x-required-permission: WORKSHOP_CREATE
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/workshop.yaml#/CreateWorkshopRequest'
    responses:
      '429':
        $ref: '../common/responses.yaml#/TooManyRequests'
      '201':
        description: Workshop created, status DRAFT.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/workshop.yaml#/Workshop'
      '400':
        description: Validation failure (e.g. `endTime <= startTime`, `price` inconsistent with `isPaid` — both database-schema.md §3.1 CHECK constraints).
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, missing WORKSHOP_CREATE permission.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'

managedWorkshops:
  get:
    operationId: listManagedWorkshops
    summary: List workshops for management, drafts included (Phase 8, D119)
    description: >-
      The Organizer's and Admin's view of the workshops (`docs/requirement.md` §1.3.3): every status,
      `DRAFT` and `CANCELLED` included, which the public `listWorkshops` never returns. A separate
      operation rather than a `status` parameter on `listWorkshops`, so the public list's cache key and
      payload stay exactly what they are. Read from the Master and never cached, as a workshop manager's
      `getWorkshop` is: an Organizer who has just created or published a workshop sees it in the next
      response. Ordered by `startTime` descending, then `id`. The projection is the catalog's
      `WorkshopSummary`, so `seatsTaken` here is the Master's own figure, not a cached one.
      Authorization: a caller holding `WORKSHOP_EDIT`. `WORKSHOP_CREATE` alone does not list: creating a
      workshop does not entitle one to read the others.
    tags: [Workshop]
    x-required-permission: WORKSHOP_EDIT
    parameters:
      - name: status
        in: query
        required: false
        description: Only workshops in this status; absent means all four.
        schema:
          $ref: '../schemas/workshop.yaml#/WorkshopStatus'
      - name: q
        in: query
        required: false
        description: Case-insensitive substring of the title. Blank is the same as absent.
        schema:
          type: string
          maxLength: 255
      - $ref: '../common/pagination.yaml#/PageParam'
      - $ref: '../common/pagination.yaml#/SizeParam'
    responses:
      '429':
        $ref: '../common/responses.yaml#/TooManyRequests'
      '200':
        description: Paginated workshops of every status.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/workshop.yaml#/WorkshopListResponse'
      '400':
        description: Invalid query parameters (an unknown `status`, `size` above the cap).
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, missing WORKSHOP_EDIT permission.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'

workshopById:
  get:
    operationId: getWorkshop
    summary: Get workshop detail
    description: >-
      `docs/requirement.md` §1.3.1: "full speaker and location information,
      along with real-time updated seat availability." Merges
      `../../../docs/technical-design/modules/workshop.md` §2's `detail` (300s TTL) and `seats` (3s
      TTL) cache reads into one response. Public — no authentication
      required — **for a `PUBLISHED`/`CANCELLED`/`COMPLETED` workshop only**,
      the same visibility rule `listWorkshops` applies. A `DRAFT` workshop is
      never returned to an unauthenticated caller, or to one lacking
      `WORKSHOP_CREATE`/`WORKSHOP_EDIT`: `workshops` has no per-row owner
      column (`../../../docs/technical-design/platform/database-schema.md` §3.1), so this endpoint
      cannot check "is this caller the workshop's own Organizer," only
      whether the caller holds a permission broad enough to manage any
      workshop. A `DRAFT` workshop requested by a caller without that
      permission gets `404`, not `403` — so an unauthorized caller can't
      distinguish "no such workshop" from "exists but is a draft you can't
      see."
    tags: [Workshop]
    security: []
    parameters:
      - $ref: '#/WorkshopIdParam'
    responses:
      '429':
        $ref: '../common/responses.yaml#/TooManyRequests'
      '200':
        description: Workshop detail.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/workshop.yaml#/Workshop'
      '404':
        description: >-
          No workshop with this id — or the workshop is `DRAFT` and the
          caller (unauthenticated, or authenticated without
          `WORKSHOP_CREATE`/`WORKSHOP_EDIT`) isn't permitted to see it.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
  patch:
    operationId: updateWorkshop
    summary: Edit or reschedule a workshop
    description: >-
      `docs/requirement.md` §1.3.3: "full rights to... edit... or reschedule
      workshops." Reschedule is this same operation with only
      `startTime`/`endTime` set — `database-schema.md` §3.1 confirms
      reschedule is a field update, not a status transition. Triggers
      `WORKSHOP_RESCHEDULED` notifications to registered students
      (`../../../docs/technical-design/modules/notification.md`) when `startTime`/`endTime` changes;
      notification dispatch mechanics are that module's concern, not this
      contract's.
    tags: [Workshop]
    x-required-permission: WORKSHOP_EDIT
    parameters:
      - $ref: '#/WorkshopIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/workshop.yaml#/UpdateWorkshopRequest'
    responses:
      '429':
        $ref: '../common/responses.yaml#/TooManyRequests'
      '200':
        description: Updated workshop.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/workshop.yaml#/Workshop'
      '400':
        description: Validation failure.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, missing WORKSHOP_EDIT permission.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '404':
        description: No workshop with this id.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '409':
        description: >-
          The edit conflicts with the workshop's current state: it is
          `CANCELLED` or `COMPLETED` (terminal — every edit and reschedule is
          refused, even an empty one); or the new values contradict stored
          ones in a way the request body alone cannot show (`capacity` below
          the seats already taken, a `price` on a free workshop, an
          `endTime`/`startTime` that is not after the other, stored, one —
          the stateful checks the `startTime`/`price` descriptions above
          leave to the handler); or another update changed the workshop
          first (optimistic-concurrency loss).
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'

workshopPublish:
  post:
    operationId: publishWorkshop
    summary: Publish a DRAFT workshop
    description: >-
      **Inferred endpoint — flagged as an assumption, not directly narrated
      anywhere in this corpus.** `database-schema.md` §3.1 defines `DRAFT` as
      the creation-time default and `PUBLISHED` as a distinct status, and
      `../../../docs/technical-design/modules/workshop.md` §7 states brochure upload happens "against
      a workshop already created in DRAFT status," but no document specifies
      the mechanic that actually moves a row from `DRAFT` to `PUBLISHED`.
      Modeled as its own action (not folded into `updateWorkshop`) because
      it's a one-way lifecycle transition with a distinct effect — the
      workshop becomes visible in `listWorkshops` — not an ordinary field
      edit. Revisit this endpoint's shape when a real requirement or design
      note fixes the draft→publish workflow explicitly.
    tags: [Workshop]
    x-required-permission: WORKSHOP_EDIT
    parameters:
      - $ref: '#/WorkshopIdParam'
    responses:
      '429':
        $ref: '../common/responses.yaml#/TooManyRequests'
      '200':
        description: Workshop is now PUBLISHED.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/workshop.yaml#/Workshop'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, missing WORKSHOP_EDIT permission.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '404':
        description: No workshop with this id.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '409':
        description: Workshop is not in DRAFT status.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'

workshopCancel:
  post:
    operationId: cancelWorkshop
    summary: Cancel a workshop
    description: >-
      `docs/requirement.md` §1.3.3: "full rights to... cancel... workshops,"
      and cancellation "must automatically trigger the notification process
      to all affected students, with no manual action required." This
      operation performs the status transition and the same-transaction
      outbox write (`architecture.md` §4.3); the Notification module's own
      dispatch of `WORKSHOP_CANCELLED` (`../../../docs/technical-design/modules/notification.md`) is
      out of scope for this file.
    tags: [Workshop]
    x-required-permission: WORKSHOP_EDIT
    parameters:
      - $ref: '#/WorkshopIdParam'
    responses:
      '429':
        $ref: '../common/responses.yaml#/TooManyRequests'
      '200':
        description: Workshop is now CANCELLED.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/workshop.yaml#/Workshop'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, missing WORKSHOP_EDIT permission.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '404':
        description: No workshop with this id.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '409':
        description: Workshop is already CANCELLED or COMPLETED.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'

workshopBrochureUploadUrl:
  post:
    operationId: requestBrochureUploadUrl
    summary: Issue a presigned brochure-upload URL
    description: >-
      `../../../docs/technical-design/modules/workshop.md` §7 issuance step, verbatim endpoint path.
      PDF bytes travel directly from the Organizer's browser to S3/MinIO —
      never through the Backend API (`workshop.md`'s PDF Upload & Access
      Pattern ADR).
      Either permission satisfies the check: WORKSHOP_CREATE covers uploading
      during the same authoring session a DRAFT was just created in;
      WORKSHOP_EDIT covers replacing the brochure on a workshop created
      earlier (`workshop.md` §7).
    tags: [Workshop]
    x-required-permission: [WORKSHOP_CREATE, WORKSHOP_EDIT]
    parameters:
      - $ref: '#/WorkshopIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [contentType]
            properties:
              contentType:
                type: string
                enum: [application/pdf]
    responses:
      '429':
        $ref: '../common/responses.yaml#/TooManyRequests'
      '200':
        description: >-
          Presigned PUT URL issued. The URL authorizes exactly one `PUT` of a PDF (it is signed for
          `Content-Type: application/pdf`) to one fresh key, for ten minutes. The server remembers
          that key (`workshop.md` §7, database-schema `V7`); issuing again replaces it. No call is
          made to the bucket, so this works while object storage is down.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/workshop.yaml#/BrochureUploadUrlResponse'
      '400':
        description: '`contentType` is missing or is not `application/pdf`.'
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, missing both WORKSHOP_CREATE and WORKSHOP_EDIT.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '404':
        description: No workshop with this id.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '409':
        description: Workshop is already CANCELLED or COMPLETED.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'

workshopBrochureUploadConfirm:
  post:
    operationId: confirmBrochureUpload
    summary: Confirm a completed brochure upload
    description: >-
      `../../../docs/technical-design/modules/workshop.md` §7 confirmation step, verbatim endpoint
      path — called by the Organizer's browser immediately after a
      successful `PUT` to the presigned URL. Server-side `HeadObject`
      against the issued key is what makes this trustworthy, not the
      browser's claim of success. On success, publishes
      `unihub.workshop.summarization.requested` via the transactional
      outbox (`workshop.md` §3/§7) in the same transaction that writes
      `brochure_s3_key`.
    tags: [Workshop]
    x-required-permission: [WORKSHOP_CREATE, WORKSHOP_EDIT]
    parameters:
      - $ref: '#/WorkshopIdParam'
    responses:
      '429':
        $ref: '../common/responses.yaml#/TooManyRequests'
      '200':
        description: Object confirmed to exist; brochure_s3_key persisted, summarization requested.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/workshop.yaml#/BrochureUploadConfirmResponse'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, missing both WORKSHOP_CREATE and WORKSHOP_EDIT.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '404':
        description: >-
          No workshop with this id, or `HeadObject` found nothing at the
          issued key (the browser has not uploaded yet) — nothing persisted,
          the issued key is kept, the Organizer can retry (`workshop.md` §7).
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '409':
        description: >-
          Nothing to confirm (problem `type` `urn:unihub:problem:brochure-upload-not-issued`): no
          upload URL was issued for this workshop, it was already confirmed (also what the loser of
          two concurrent confirmations gets; exactly one summarization request is ever written per
          issued key), or the workshop is CANCELLED/COMPLETED.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '503':
        description: >-
          Object storage could not be reached (problem `type` `urn:unihub:problem:storage-unavailable`,
          `../../../docs/technical-design/modules/workshop.md` §7, §10; Phase 5 checklist D60). Nothing
          was persisted and the issued key is kept, so the **same** call succeeds once storage is back.
          Only this endpoint can answer it: an object-storage outage never touches registration,
          payment or check-in (INV-19).
        headers:
          Retry-After:
            $ref: '../common/headers.yaml#/RetryAfter'
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'

workshopCoverImageUploadUrl:
  post:
    operationId: requestCoverImageUploadUrl
    summary: Issue a presigned cover-image upload URL
    description: >-
      Phase 8 (D114, D120–D122). Same two-step shape as the brochure upload: the image's bytes travel
      from the Organizer's browser to the bucket on the issued URL, never through this API. The URL is
      signed for the declared `Content-Type` and the exact `Content-Length`, so a bucket that checks the
      signature accepts that file and nothing else. The key is fresh and unguessable
      (`covers/{workshopId}/{uuid}.{jpg|png|webp}`); issuing again replaces the pending key, never the
      confirmed cover. No call is made to the bucket, so this works while object storage is down.
      Only JPEG, PNG and WebP: an SVG on the application's own origin could carry script, and the
      bucket's response does not carry the Web's CSP. Either permission satisfies the check, as for the
      brochure.
    tags: [Workshop]
    x-required-permission: [WORKSHOP_CREATE, WORKSHOP_EDIT]
    parameters:
      - $ref: '#/WorkshopIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [contentType, contentLength]
            properties:
              contentType:
                type: string
                enum: [image/jpeg, image/png, image/webp]
              contentLength:
                type: integer
                minimum: 1
                maximum: 2097152
                description: >-
                  The exact size of the file in bytes (at most 2 MiB). The URL is signed for it. A
                  16:9 image is recommended; the shape is not enforced.
    responses:
      '429':
        $ref: '../common/responses.yaml#/TooManyRequests'
      '200':
        description: >-
          Presigned PUT URL issued for exactly one `PUT` of that file to one fresh key, for ten
          minutes. The URL is a path on the application's own origin (the edge forwards it to the
          bucket unchanged: the signature covers the host and the path).
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/workshop.yaml#/CoverImageUploadUrlResponse'
      '400':
        description: '`contentType` is missing or not one of the three raster types, or `contentLength` is missing or outside 1 … 2097152.'
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, missing both WORKSHOP_CREATE and WORKSHOP_EDIT.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '404':
        description: No workshop with this id.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '409':
        description: Workshop is already CANCELLED or COMPLETED.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'

workshopCoverImageUploadConfirm:
  post:
    operationId: confirmCoverImageUpload
    summary: Confirm a completed cover-image upload
    description: >-
      Phase 8 (D114, D120–D122). Called by the Organizer's browser immediately after a successful `PUT`.
      What is checked is what arrived, never what the client said: the server reads the stored size and
      `Content-Type` (`HeadObject`), compares the type with the one the key was issued for, and reads the
      object's first bytes to confirm the format. A file that fails is **deleted** and the pending key
      cleared (`422`); the Organizer asks for a new URL. On success the pending key becomes the workshop's
      cover and its path is returned. There is no consumer and no outbox row: unlike the brochure there
      is nothing to compute afterwards.
    tags: [Workshop]
    x-required-permission: [WORKSHOP_CREATE, WORKSHOP_EDIT]
    parameters:
      - $ref: '#/WorkshopIdParam'
    responses:
      '429':
        $ref: '../common/responses.yaml#/TooManyRequests'
      '200':
        description: Object confirmed; `cover_image_key` persisted and the cached detail dropped.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/workshop.yaml#/CoverImageUploadConfirmResponse'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, missing both WORKSHOP_CREATE and WORKSHOP_EDIT.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '404':
        description: >-
          No workshop with this id, or nothing at the issued key yet (the browser has not uploaded) —
          nothing persisted, the issued key is kept, the Organizer can retry.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '409':
        description: >-
          Nothing to confirm (problem `type` `urn:unihub:problem:cover-image-upload-not-issued`): no URL
          was issued, it was already confirmed or its file was rejected (also what the loser of two
          concurrent confirmations gets), or the workshop is CANCELLED/COMPLETED.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '422':
        description: >-
          The uploaded file is not an acceptable cover (problem `type` `urn:unihub:problem:cover-image-rejected`):
          empty or over 2 MiB, stored as another type than the URL was issued for, or its first bytes are not
          that format. The object was deleted and the pending key cleared.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '503':
        description: >-
          Object storage could not be reached (problem `type` `urn:unihub:problem:storage-unavailable`).
          Nothing was persisted and the issued key is kept, so the **same** call succeeds once storage is
          back. An object-storage outage never touches registration, payment or check-in (INV-19).
        headers:
          Retry-After:
            $ref: '../common/headers.yaml#/RetryAfter'
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
