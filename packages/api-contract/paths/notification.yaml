notifications:
  get:
    operationId: listMyNotifications
    summary: List the caller's in-app notification inbox
    description: >-
      The caller's in-app notification inbox (REQ-1.3.2: "an in-app
      notification"; `../../../docs/technical-design/modules/notification.md`
      §1, §3; Phase 4 checklist D38). Each item carries the `title` and
      `body` rendered once when the notification was created, so a client
      shows them as they are and never rebuilds the wording itself.

      **Always scoped to the authenticated caller — there is no query
      parameter to list another user's notifications from this endpoint**,
      the same guarantee `../paths/registration.yaml#/registrations`'s
      `listMyRegistrations` states for its own "my X" read. The caller is the
      JWT's `sub`.

      **Authorization: any authenticated user, no permission code** — like
      `listMyRegistrations`, the scope-to-caller rule above is the whole
      check, so a `403` never applies here (a missing or invalid token is
      `401`).

      **Always scoped to `channel = IN_APP` — not configurable.** An `EMAIL`
      row lives in the same `notifications` table but a student reads that in
      their mail client, not through this API. No `channel` query parameter
      is offered, since exactly one channel is ever returned.

      **Newest first** (`created_at` descending), paginated. A reschedule that
      follows another one is a second, separate notification.

      **No read/unread state, by decision (D38).** No requirement asks for
      one, so the table has no such column and there is no "mark as read"
      operation; it can be added later by an additive migration.
    tags: [Notification]
    parameters:
      - name: status
        in: query
        required: false
        description: Delivery status of the row (not read status), to narrow the list. Omit for all.
        schema:
          $ref: '../schemas/notification.yaml#/NotificationDeliveryStatus'
      - $ref: '../common/pagination.yaml#/PageParam'
      - $ref: '../common/pagination.yaml#/SizeParam'
      - $ref: '../common/headers.yaml#/CorrelationIdRequest'
    responses:
      '200':
        description: The caller's in-app notifications, newest first.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/notification.yaml#/NotificationListResponse'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
