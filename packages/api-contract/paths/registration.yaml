RegistrationIdParam:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid

RegistrationWorkshopIdParam:
  name: workshopId
  in: path
  required: true
  schema:
    type: string
    format: uuid

registrations:
  post:
    operationId: createRegistration
    summary: Register for a workshop (reserve or confirm a seat)
    description: >-
      `../../../docs/technical-design/modules/registration.md` §2/§4 — this system's single
      highest-risk correctness path. Requires `REGISTRATION_CREATE`
      (seeded for the Student role; it also covers paying for one's own
      registration via `chargePayment`); the registration is always created
      for the authenticated caller.

      **Idempotency (§4):** a retried request carrying the same
      `Idempotency-Key` (scoped to this operation and the authenticated
      caller) returns the original recorded response verbatim, including
      its original status code — the seat-reservation transaction is never
      re-attempted, not even as a no-op re-check. This means a retry of a
      request that originally got `409` also gets `409` again, even if a
      seat has since freed up; idempotency guarantees replay of the
      recorded result, not re-evaluation of current state. Same key with a
      different body → `422`; same key while the first request is still in
      its transaction → `409` (retry shortly and it replays). A `503` is
      never recorded.

      **Two distinct rejection paths, not one (§2):** `503` means the
      *coordination layer* couldn't be reached or was contended — the seat
      may still be available, retry shortly. `409` means the lock was
      acquired and the workshop was definitively full — retrying the exact
      same request won't change that outcome.
    tags: [Registration]
    x-required-permission: REGISTRATION_CREATE
    x-idempotent: true
    parameters:
      - $ref: '../common/headers.yaml#/IdempotencyKey'
      - $ref: '../common/headers.yaml#/CorrelationIdRequest'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/registration.yaml#/CreateRegistrationRequest'
    responses:
      '201':
        description: >-
          Registration created — `RESERVED` (paid ticket, 15-minute hold
          starts now) or `CONFIRMED` (free ticket) depending on the target
          workshop's `isPaid`.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/registration.yaml#/Registration'
      '400':
        description: Validation failure (e.g. missing or malformed `workshopId`).
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, missing the `REGISTRATION_CREATE` permission. Nothing recorded.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '404':
        description: No workshop with this id.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '409':
        description: >-
          Lock acquired, workshop is sold out
          (`../../../docs/technical-design/modules/registration.md` §2) — or the caller already has
          an active (`RESERVED`/`CONFIRMED`) registration for this workshop
          (`../../../docs/technical-design/platform/database-schema.md` §4.1's partial unique index)
          — or the workshop is not open for registration, or a request with
          this `Idempotency-Key` is still being processed (the only
          retryable cause; not recorded). The others are recorded under the
          key and replay identically. The cause is the problem `type`:
          `urn:unihub:problem:sold-out`, `…:already-registered`,
          `…:registration-not-open`, `…:idempotency-key-in-use`.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '422':
        description: >-
          This `Idempotency-Key` was already used by the same caller with a
          different request body
          (`../../../docs/guidelines/backend-coding-standards.md` §21). Nothing was executed.
          A client bug, not a retry case. Problem `type`
          `urn:unihub:problem:idempotency-key-reused`.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '429':
        description: >-
          Per-user registration-attempt rate limit exceeded
          (`../../../docs/technical-design/platform/distributed-coordination.md` §3 — 5 requests /
          10s, key `unihub:ratelimit:registration:{userId}`). Distinct from
          the `503` below: this is the caller's own request budget, not
          contention over a specific workshop's seat.
        headers:
          Retry-After:
            $ref: '../common/headers.yaml#/RetryAfter'
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '503':
        description: >-
          Seat-lock contention or Redis unreachable
          (`../../../docs/technical-design/modules/registration.md` §2) — transient, safe to retry.
          Per-workshop coordination-layer unavailability, not the caller's
          own request rate — see `429` above for that distinction.
        headers:
          Retry-After:
            $ref: '../common/headers.yaml#/RetryAfter'
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
  get:
    operationId: listMyRegistrations
    summary: List the caller's own registrations
    description: >-
      "My registrations" (`../../../docs/technical-design/platform/database-schema.md` §4.1's
      `(user_id)` index note). Always scoped to the authenticated caller —
      there is no query parameter to list another user's registrations from
      this endpoint.
    tags: [Registration]
    parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '../schemas/registration.yaml#/RegistrationStatus'
      - $ref: '../common/pagination.yaml#/PageParam'
      - $ref: '../common/pagination.yaml#/SizeParam'
      - $ref: '../common/headers.yaml#/CorrelationIdRequest'
    responses:
      '200':
        description: The caller's registrations.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/registration.yaml#/RegistrationListResponse'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'

registrationById:
  get:
    operationId: getRegistration
    summary: Get a single registration, including its QR e-ticket payload
    description: >-
      Ownership-checked, not permission-code-checked: the caller must be the
      registration's own `userId`. This is the endpoint the Web Application
      uses to render/download the e-ticket
      (`CLAUDE.md`'s "Student never touches the Mobile App" boundary — this
      is where that ticket lives).

      **Paid registration, after payment:** confirmation is asynchronous
      (`../../../docs/technical-design/modules/registration.md` §5). For a short window
      `getPayment` shows `SUCCEEDED` while this endpoint still shows
      `RESERVED` — "confirming"; keep polling until the status leaves
      `RESERVED`. If the hold had already expired (or the registration was
      cancelled) when the payment succeeded, the status stays `EXPIRED`/
      `CANCELLED` and the payment is refunded instead
      (`REFUND_REQUIRED` → `REFUNDED`); the seat is not re-granted.
    tags: [Registration]
    parameters:
      - $ref: '#/RegistrationIdParam'
      - $ref: '../common/headers.yaml#/CorrelationIdRequest'
    responses:
      '200':
        description: Full registration detail.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/registration.yaml#/Registration'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, but the caller does not own this registration.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '404':
        description: No registration with this id.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'

registrationCancel:
  post:
    operationId: cancelRegistration
    summary: Cancel an active registration
    description: >-
      **Inferred endpoint — flagged as an assumption.**
      `../../../docs/technical-design/platform/database-schema.md` §4.1 defines `CANCELLED` as a
      real status value, but no document in this corpus narrates the HTTP
      trigger or transaction shape for cancellation the way §3 narrates
      hold-expiry in full. Modeled here as reusing §3's own pattern —
      acquire `unihub:lock:seat:{workshopId}`, single transaction moving
      `status` to `CANCELLED` and releasing `workshops.seats_taken` — since
      that is the only seat-releasing transaction shape this corpus actually
      specifies, not a new one invented for this endpoint.

      **Self-service only, by design of this v1 surface:** the only
      authorization this operation implements is ownership — the caller
      must be the registration's own `userId` (see the `403` below). An
      Organizer cancelling another user's registration on their behalf (e.g.
      handling a support request) is a distinct capability this operation
      does **not** grant — it would need its own `x-required-permission`
      path and is out of scope until a design note calls for it explicitly.
      Revisit this endpoint when a design note fixes cancellation's own
      rules (e.g. a cutoff time before the workshop start, whether a paid
      ticket's cancellation refunds anything — payment refund flows are
      `../../../docs/technical-design/modules/payment.md`'s concern, undocumented there too — or an
      Organizer-cancellation capability).
    tags: [Registration]
    parameters:
      - $ref: '#/RegistrationIdParam'
      - $ref: '../common/headers.yaml#/CorrelationIdRequest'
    responses:
      '200':
        description: Registration is now CANCELLED, seat released.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/registration.yaml#/Registration'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, but the caller does not own this registration.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '404':
        description: No registration with this id.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '409':
        description: Registration is already CANCELLED or EXPIRED.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '503':
        description: Seat-lock contention or Redis unreachable — same coordination layer as createRegistration.
        headers:
          Retry-After:
            $ref: '../common/headers.yaml#/RetryAfter'
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'

workshopRegistrations:
  get:
    operationId: listWorkshopRegistrations
    summary: Organizer/Admin view of a workshop's registrations
    description: >-
      Reporting view backing `docs/requirement.md` §1.3.3's "clear, visual
      reports and statistics on registration counts" — this endpoint
      supplies the underlying data; aggregation/visualization is a frontend
      concern. Backed by `../../../docs/technical-design/platform/database-schema.md` §4.1's
      `(workshop_id)` index, documented there as existing for exactly this
      reporting purpose.
    tags: [Registration]
    x-required-permission: REPORT_VIEW
    parameters:
      - $ref: '#/RegistrationWorkshopIdParam'
      - name: status
        in: query
        required: false
        schema:
          $ref: '../schemas/registration.yaml#/RegistrationStatus'
      - $ref: '../common/pagination.yaml#/PageParam'
      - $ref: '../common/pagination.yaml#/SizeParam'
      - $ref: '../common/headers.yaml#/CorrelationIdRequest'
    responses:
      '200':
        description: Registrations for the given workshop.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/registration.yaml#/RegistrationListResponse'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, missing REPORT_VIEW permission.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '404':
        description: No workshop with this id.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
