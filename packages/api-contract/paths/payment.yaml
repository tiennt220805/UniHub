PaymentIdParam:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid

payments:
  post:
    operationId: chargePayment
    summary: Initiate a payment charge for a RESERVED registration
    description: >-
      `../../../docs/technical-design/modules/payment.md` §3/§8. Requires `REGISTRATION_CREATE` — the
      same permission as `createRegistration` — and the caller must own the
      registration (see `403` below).

      **The response carries the payment's real status when the charge
      step completed** (`payment.md` §8): `SUCCEEDED` or `FAILED` when the
      gateway answered at once, `PENDING` when the outcome is not yet known
      (including a timeout after the request reached the gateway). The body
      is a snapshot — `getPayment` is the source of truth; while `PENDING`,
      poll it until the webhook or the reconciliation sweep resolves it.

      **Idempotency (§8):** a retried request carrying the same
      `Idempotency-Key` (scoped to this operation and the authenticated
      caller) returns the original recorded response verbatim — the Payment
      Gateway is never called a second time for the same key, "not even to
      double-check." Same key with a different body → `422`; same key while
      the first request is still being processed → `409`.

      **At most one live payment per registration (§1):** a registration
      can have several attempts, but only one that is `PENDING`,
      `SUCCEEDED`, `REFUND_REQUIRED` or `REFUNDED`. A payment that ends
      `FAILED` or `CANCELLED` is final for its key — retrying that key
      replays it; a new attempt (e.g. another card) uses a **new** key and
      is accepted.

      **Gateway not reached vs. reached (§3, §8):** if the request never
      left UniHub — the shared `paymentGateway` breaker refused it, or the
      connection failed — the response is `503`, nothing is recorded under
      the key, and the registration's seat-hold is left completely untouched:
      the student keeps the remainder of their 15-minute window and retries
      with the **same** key. If the request reached the gateway but the
      outcome is unknown (timeout, error after sending), the response is
      `201` with `PENDING`; a same-key retry replays it and the gateway is
      never called twice.
    tags: [Payment]
    x-required-permission: REGISTRATION_CREATE
    x-idempotent: true
    parameters:
      - $ref: '../common/headers.yaml#/IdempotencyKey'
      - $ref: '../common/headers.yaml#/CorrelationIdRequest'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/payment.yaml#/CreatePaymentChargeRequest'
    responses:
      '201':
        description: Charge processed — the body carries the payment's status when the charge step completed (`SUCCEEDED`, `FAILED` or `PENDING`). While `PENDING`, poll `getPayment`.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/payment.yaml#/Payment'
      '400':
        description: Validation failure (e.g. missing or malformed `registrationId`/`paymentMethodToken`).
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, but missing the `REGISTRATION_CREATE` permission or not the owner of the target registration. Nothing recorded.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '404':
        description: No registration with the given `registrationId`.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '409':
        description: >-
          One of three causes: the registration is not `RESERVED` (already
          `CONFIRMED`, `CANCELLED`, or `EXPIRED`); the registration already
          has a live payment (`PENDING`, `SUCCEEDED`, `REFUND_REQUIRED` or
          `REFUNDED` — `../../../docs/technical-design/platform/database-schema.md` §5.1's partial
          unique index), e.g. from another tab with another key; or a
          request with this `Idempotency-Key` is still being processed (the
          only retryable cause — a same-key retry later replays its result).
          The first two are recorded under the key and replay identically.
          The cause is the problem `type`:
          `urn:unihub:problem:registration-not-reserved`,
          `…:payment-in-progress`, `…:idempotency-key-in-use`.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '422':
        description: >-
          This `Idempotency-Key` was already used by the same caller with a
          different request body
          (`../../../docs/guidelines/backend-coding-standards.md` §21). Nothing was executed.
          A client bug, not a retry case. Problem `type`
          `urn:unihub:problem:idempotency-key-reused`.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '503':
        description: >-
          The request never reached the gateway
          (`../../../docs/technical-design/modules/payment.md` §3): the `paymentGateway` circuit
          refused it, or the connection failed. Refused before anything was
          written → no `payments` row; refused right after the payment row
          was written → that row is now `CANCELLED`. Either way nothing is
          recorded under the `Idempotency-Key`, the seat-hold is untouched,
          and a retry with the **same** key executes for real. A timeout
          **after** the request reached the gateway is a `201` `PENDING`, not
          a `503`. **`Retry-After`'s value is
          inferred — flagged as an assumption.** Not specified in
          `payment.md`; set here to the breaker's own
          `wait-duration-in-open-state` (30s, `payment.md` §2) as the
          natural value, by analogy with `createRegistration`'s
          `Retry-After` being tied to its own lock's wait budget — but
          unlike that endpoint, `payment.md` never actually prescribes this
          header for this path.
        headers:
          Retry-After:
            $ref: '../common/headers.yaml#/RetryAfter'
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'

paymentById:
  get:
    operationId: getPayment
    summary: Get a payment's current status
    description: >-
      **Inferred endpoint — flagged as an assumption.** Not narrated
      anywhere in `payment.md`, but a direct corollary of `chargePayment`
      always returning `PENDING`: a client needs some way to observe
      eventual resolution, and no push/SSE mechanism exists anywhere in
      this corpus. Ownership-checked, not permission-code-checked — same
      model as `getRegistration`.

      **After `SUCCEEDED`:** the registration is confirmed asynchronously
      (`../../../docs/technical-design/modules/registration.md` §5) — for a short window this
      endpoint shows `SUCCEEDED` while `getRegistration` still shows
      `RESERVED`; keep polling `getRegistration` until it leaves `RESERVED`.
      If the registration had already expired or been cancelled, the
      payment moves to `REFUND_REQUIRED` and then `REFUNDED`
      (`../../../docs/technical-design/modules/payment.md` §9).
    tags: [Payment]
    parameters:
      - $ref: '#/PaymentIdParam'
      - $ref: '../common/headers.yaml#/CorrelationIdRequest'
    responses:
      '200':
        description: Current payment status.
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
        content:
          application/json:
            schema:
              $ref: '../schemas/payment.yaml#/Payment'
      '401':
        description: Missing or invalid token.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '403':
        description: Valid token, but the caller does not own the underlying registration.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
      '404':
        description: No payment with this id.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'

paymentGatewayWebhook:
  post:
    operationId: handlePaymentGatewayWebhook
    summary: Payment Gateway webhook callback
    description: >-
      `../../../docs/technical-design/modules/payment.md` §7, verbatim route and model — this
      system's fast path for payment resolution, complementing (never
      replacing) the reconciliation sweep's 15-minute-late backstop (§6).

      **Authentication is deliberately not `bearerAuth` — the only
      operation in this API that isn't.** The caller is the Payment
      Gateway, not a UniHub user; it holds no UniHub session and
      `../../../docs/technical-design/platform/auth-and-identity.md`'s entire model (resolved
      permissions, `hasAuthority`) assumes an authenticated *user*, which
      doesn't apply here. Trust is established instead by verifying the
      gateway's signature header (`Stripe-Signature`) as an HMAC over the
      **raw, unparsed** request body against a shared webhook-signing
      secret — never by re-serializing the parsed payload, which risks a
      whitespace/key-ordering mismatch that fails verification for a
      legitimate request. **Exempt from per-user/per-IP rate limiting**
      (`../../../docs/technical-design/platform/distributed-coordination.md` §3) — the gateway is a
      known, trusted, high-volume caller by design, not a traffic-abuse
      risk.

      **Always responds `200` once the payload has been durably handled**
      (found-and-resolved, found-but-already-resolved, or
      not-found-so-discarded all return `200`) — a non-2xx response tells
      the gateway to retry delivery, which this system doesn't need once
      the row is resolved or determined not to apply. Only an invalid
      signature is rejected, before any byte of the body is trusted.
    tags: [Payment]
    x-auth-model: gateway-webhook-signature
    security: []
    parameters:
      - name: Stripe-Signature
        in: header
        required: true
        description: HMAC signature over the raw request body, verified against a shared webhook-signing secret before any other processing.
        schema:
          type: string
      - $ref: '../common/headers.yaml#/CorrelationIdRequest'
    requestBody:
      required: true
      description: The Payment Gateway's raw event payload — schema owned by the gateway (Stripe, sandbox mode), not by this API.
      content:
        application/json:
          schema:
            type: object
            description: Opaque gateway event payload; only `gateway_transaction_id`-equivalent and outcome fields are read (`../../../docs/technical-design/modules/payment.md` §7).
    responses:
      '200':
        description: >-
          Payload durably handled: resolved (`status` left `PENDING`),
          already resolved by a race with the reconciliation sweep or a
          prior webhook delivery (no-op), or the `gateway_transaction_id`
          doesn't match any `payments` row (logged and discarded — not
          every webhook necessarily maps to a UniHub-initiated charge).
        headers:
          X-Correlation-Id:
            $ref: '../common/headers.yaml#/CorrelationIdResponse'
      '400':
        description: Invalid signature — rejected before any byte of the body is trusted.
        content:
          application/problem+json:
            schema:
              $ref: '../common/error.yaml'
