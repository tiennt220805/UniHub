openapi: 3.1.0
info:
  title: UniHub Workshop System API
  version: v1
  description: >-
    HTTP contract for the UniHub Backend API — a stateless Spring Boot
    Modular Monolith (`../../CLAUDE.md`) consumed by the Web Application
    (Student + Organizer/Admin) and the Check-in Client (Check-in Staff
    only). This spec formalizes endpoints already narrated in prose across
    `../../docs/technical-design/modules/*.md`; it does not introduce a second, conflicting contract
    — see `README.md` for the drift-prevention plan once implementation
    exists.


    **Status:** all six business modules are drafted — Workshop,
    Registration, Payment, Check-in, User, Notification. See `README.md`
    for what's still intentionally out of scope even so (RBAC
    administration, first-login password setup, user suspension/
    reactivation, notification read/unread state).
  contact:
    name: UniHub Engineering
  license:
    name: Proprietary — internal use only, not for public distribution (UniHub PoC)
    identifier: LicenseRef-Proprietary
servers:
  - url: 'https://{environment}.unihub.local'
    description: >-
      Single Ingress Controller entry point (`../../docs/architecture.md` §1.2)
      — terminates TLS, load-balances across Backend API instances. This
      PoC has no separate staging/production split
      (`../../docs/proposal.md` §5.2); `local` (Minikube) and `poc` are the only
      two environments.
    variables:
      environment:
        default: local
        enum: [local, poc]
tags:
  - name: Workshop
    description: Workshop catalog, brochure upload, AI summarization trigger (`../../docs/technical-design/modules/workshop.md`).
    x-status: drafted
  - name: Registration
    description: Seat reservation, the system's highest-risk correctness path (`../../docs/technical-design/modules/registration.md`).
    x-status: drafted
  - name: User
    description: Identity, RBAC, legacy student sync (`../../docs/technical-design/modules/user.md`).
    x-status: drafted
  - name: Payment
    description: Payment Gateway integration, idempotent charge, reconciliation (`../../docs/technical-design/modules/payment.md`).
    x-status: drafted
  - name: Check-in
    description: Offline QR verification key distribution, scan-batch sync/reconciliation (`../../docs/technical-design/modules/checkin.md`).
    x-status: drafted
  - name: Notification
    description: In-app notification inbox (dispatch itself is async/event-driven, not a synchronous API — `../../docs/technical-design/modules/notification.md`).
    x-status: drafted
security:
  - bearerAuth: []
paths:
  /api/v1/workshops:
    $ref: './paths/workshop.yaml#/workshops'
  /api/v1/workshops/{id}:
    $ref: './paths/workshop.yaml#/workshopById'
  /api/v1/workshops/{id}/publish:
    $ref: './paths/workshop.yaml#/workshopPublish'
  /api/v1/workshops/{id}/cancel:
    $ref: './paths/workshop.yaml#/workshopCancel'
  /api/v1/workshops/{id}/brochure-upload-url:
    $ref: './paths/workshop.yaml#/workshopBrochureUploadUrl'
  /api/v1/workshops/{id}/brochure-upload-confirm:
    $ref: './paths/workshop.yaml#/workshopBrochureUploadConfirm'
  /api/v1/workshops/{workshopId}/registrations:
    $ref: './paths/registration.yaml#/workshopRegistrations'
  /api/v1/registrations:
    $ref: './paths/registration.yaml#/registrations'
  /api/v1/registrations/{id}:
    $ref: './paths/registration.yaml#/registrationById'
  /api/v1/registrations/{id}/cancel:
    $ref: './paths/registration.yaml#/registrationCancel'
  /api/v1/payments/charge:
    $ref: './paths/payment.yaml#/payments'
  /api/v1/payments/{id}:
    $ref: './paths/payment.yaml#/paymentById'
  /api/v1/webhooks/payment-gateway:
    $ref: './paths/payment.yaml#/paymentGatewayWebhook'
  /api/v1/checkin/verification-key:
    $ref: './paths/checkin.yaml#/verificationKey'
  /api/v1/checkin/sync:
    $ref: './paths/checkin.yaml#/sync'
  /api/v1/workshops/{workshopId}/attendances:
    $ref: './paths/checkin.yaml#/workshopAttendances'
  /api/v1/auth/login:
    $ref: './paths/user.yaml#/login'
  /api/v1/legacy-sync/runs:
    $ref: './paths/user.yaml#/syncRuns'
  /api/v1/legacy-sync/runs/{id}:
    $ref: './paths/user.yaml#/syncRunById'
  /api/v1/legacy-sync/errors:
    $ref: './paths/user.yaml#/syncErrors'
  /api/v1/legacy-sync/errors/{id}:
    $ref: './paths/user.yaml#/syncErrorById'
  /api/v1/notifications:
