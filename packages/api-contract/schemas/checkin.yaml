VerificationKeyResponse:
  type: object
  description: >-
    A single JWK (JSON Web Key) representing the current active ECDSA
    (`ES256`/P-256) public key (`../../../docs/technical-design/modules/checkin.md` §6). Exactly one
    key, never a set — the Check-in Client caches and overwrites, never
    accumulates, matching §6's "rotation is a total, not partial,
    revocation" guarantee. No `kid`: this corpus's single-cached-key model
    has no scenario where a client needs to disambiguate between multiple
    concurrently valid keys.
  required: [kty, crv, x, y]
  properties:
    kty:
      type: string
      const: EC
    crv:
      type: string
      const: P-256
    x:
      type: string
      description: Base64url-encoded EC public key x-coordinate (RFC 7518 §6.2.1).
    y:
      type: string
      description: Base64url-encoded EC public key y-coordinate (RFC 7518 §6.2.1).

ScanEvent:
  type: object
  description: >-
    One offline scan, as queued on-device (`../../../docs/technical-design/modules/checkin.md` §7).
    `scannedBy` is deliberately absent — derived server-side from the
    caller's own authenticated session, the same server-derivation
    discipline `../schemas/registration.yaml#/CreateRegistrationRequest`
    applies to `ticketType`. The Check-in Client authenticates its staff
    user once per session (§6); every scan in that session's synced batch
    is attributed to that same user, never client-asserted per scan.
  required: [id, ticketCode, workshopId, scannedAt, deviceId]
  properties:
    id:
      type: string
      format: uuid
      description: >-
        Client-generated on-device (`../../../docs/technical-design/platform/database-schema.md`
        §6.1) — this, not an `Idempotency-Key` header, is what makes a
        resynced batch safe to retry: re-submitting a scan with the same
        `id` is a natural no-op at the database's primary key, not the
        `idempotency_keys` mechanism (`architecture.md` §4.5), which this
        corpus scopes only to `REGISTRATION_CREATE`/`PAYMENT_CHARGE`.
    ticketCode:
      type: string
      maxLength: 64
      description: >-
        Resolved server-side to a `registrations.id` at sync time
        (`../../../docs/technical-design/modules/checkin.md` §7). Bounded to
        `registrations.ticket_code`'s own `VARCHAR(64)`
        (`../../../docs/technical-design/platform/database-schema.md` §4.1) — an over-length value
        can never resolve to a real ticket, so it's rejected here rather
        than only failing a lookup server-side.
    workshopId:
      type: string
      format: uuid
      description: >-
        **Informational only — not persisted, not currently validated
        server-side. Flagged as an assumption**, the same way
        `syncScanBatch` itself is flagged in `../paths/checkin.yaml`.
        `../../../docs/technical-design/modules/checkin.md` §7's on-device model lists `workshop_id`
        as one of the fields the Check-in Client stores locally per scan
        (alongside `ticket_code`, staff identity, `device_id`,
        `scanned_at`), so requiring it here is faithful to what the device
        actually has on hand. But §7's *sync* model only ever resolves
        `ticketCode` → `registrations.id` and never mentions using
        `workshop_id`, and `check_in_scans`
        (`../../../docs/technical-design/platform/database-schema.md` §6.1) has no `workshop_id`
        column to write it into — so as specified today, this field is
        accepted and then dropped. A plausible future use is a defensive
        cross-check (does this scan's claimed workshop match the resolved
        registration's actual `workshop_id`, catching a corrupted or
        stale on-device cache) — but that's a validation rule this corpus
        has never stated, and this schema does not invent it. Revisit when
        a design note either specifies that check or confirms the field is
        client-side-only and should be dropped from this request instead.
    scannedAt:
      type: string
      format: date-time
      description: The device's own clock at scan time — the value earliest-timestamp-wins reconciliation compares. Never the server's receipt time.
    deviceId:
      type: string
      maxLength: 100
      description: >-
        Identifies the physical Check-in Client device — reconciliation
        compares scans across devices by this field. Bounded to
        `check_in_scans.device_id`'s own `VARCHAR(100)`
        (`../../../docs/technical-design/platform/database-schema.md` §6.1).

SyncScanBatchRequest:
  type: object
  required: [scans]
  properties:
    scans:
      type: array
      minItems: 1
      maxItems: 500
      description: >-
        **`maxItems` value inferred — flagged as an assumption**; not
        specified in `../../../docs/technical-design/modules/checkin.md` §7. Bounded because
        `syncScanBatch` (`../paths/checkin.yaml`) processes every scan
        synchronously and inline against Postgres within this one request
        — an unbounded array here would mean an unbounded number of
        sequential per-scan transactions (some running the
        earliest-timestamp-wins overtake transaction) holding one request
        thread and one Postgres connection for as long as the whole batch
        takes. A device with a larger backlog splits it across multiple
        sync calls — safe to do because each scan's own client-generated
        `id` (not batch membership) is what makes resyncing idempotent
        (`ScanEvent.id`'s description above), and the device's local queue
        (Expo SQLite) already survives partial syncing across app
        restarts.
      items:
        $ref: '#/ScanEvent'

ScanSyncResult:
  type: object
  description: Per-scan outcome, keyed by the client-generated `id` so the device can update its local queue state (e.g. mark synced, drop from the pending queue).
  required: [id, outcome]
  properties:
    id:
      type: string
      format: uuid
      description: Echoes the request scan's `id`.
    outcome:
      $ref: '#/CheckInScanOutcome'

CheckInScanOutcome:
  type: string
  enum: [ACCEPTED, REJECTED_DUPLICATE, REJECTED_INVALID]
  description: >-
    `../../../docs/technical-design/platform/database-schema.md` §6.1. Not immutable at the
    database layer — a later-syncing batch with an earlier `scannedAt` can
    flip a previously `ACCEPTED` scan to `REJECTED_DUPLICATE`
    (`../../../docs/technical-design/modules/checkin.md` §7's overtake transaction) — but the value
    returned in `SyncScanBatchResponse` reflects only the outcome as of
    *this* sync call, not a live subscription to later revisions.

SyncScanBatchResponse:
  type: object
  required: [results]
  properties:
    results:
      type: array
      items:
        $ref: '#/ScanSyncResult'

AttendanceSummary:
  type: object
  description: >-
    Reporting projection for `docs/requirement.md` §1.3.3's "real-time
    check-in rates" — one row per registration that has a winning scan
    (`../../../docs/technical-design/platform/database-schema.md` §6.2). Rate/percentage math against
    a workshop's total registrations is a frontend concern; this is the
    underlying data.
  required: [registrationId, checkedInAt]
  properties:
    registrationId:
      type: string
      format: uuid
    checkedInAt:
      type: string
      format: date-time
      description: Denormalized copy of the winning scan's `scannedAt` (`../../../docs/technical-design/platform/database-schema.md` §6.2).

AttendanceListResponse:
  type: object
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: '#/AttendanceSummary'
    page:
      $ref: '../common/pagination.yaml#/PageMeta'
