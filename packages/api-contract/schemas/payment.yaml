Payment:
  type: object
  description: >-
    Field-level source is `../../../docs/technical-design/platform/database-schema.md` §5.1. A row
    is created `PENDING` at charge-initiation and resolved later by
    whichever of {the charge step itself, webhook, reconciliation sweep}
    resolves it (`../../../docs/technical-design/modules/payment.md` §1, §8). The charge response
    carries the status at the moment the charge step completed — a final
    `SUCCEEDED`/`FAILED` when the gateway answered at once, otherwise
    `PENDING`. No push/SSE mechanism exists, so a client observes later
    resolution by polling `getPayment`.
  required: [id, registrationId, amount, currency, gateway, status, initiatedAt]
  properties:
    id:
      type: string
      format: uuid
    registrationId:
      type: string
      format: uuid
      description: 1:1 with the registration it pays for (`database-schema.md` §5.1's `UNIQUE` constraint).
    amount:
      type: number
      format: double
      exclusiveMinimum: 0
    currency:
      type: string
      example: VND
    gateway:
      type: string
      example: STRIPE
      description: Sandbox mode only (`../../../docs/proposal.md` §5.2).
    gatewayTransactionId:
      type: [string, 'null']
      description: >-
        Set once the gateway acknowledges the charge attempt — at
        charge-initiation, not at resolution — which is what lets the
        webhook (§7) and reconciliation sweep (§6) correlate an external
        event back to this row *before* it's resolved. Deliberately not
        tied to `status` via a structural `if`/`then`/`else` the way
        `resolvedAt` is below: unlike `resolvedAt`'s clean "iff left
        PENDING" rule, this field's set-vs-null timing genuinely depends on
        gateway behavior this corpus doesn't pin down further, so
        overconstraining it here would assert more than
        `../../../docs/technical-design/modules/payment.md` §1 actually guarantees.
    status:
      $ref: '#/PaymentStatus'
    initiatedAt:
      type: string
      format: date-time
      description: What the reconciliation sweep's ">15 minutes in PENDING" check measures from (`../../../docs/technical-design/modules/payment.md` §6).
    resolvedAt:
      type: [string, 'null']
      format: date-time
      description: >-
        Non-null if and only if `status` has left `PENDING`
        (`database-schema.md` §5.1). Structurally enforced below via
        `if`/`then`/`else`, same technique as
        `../schemas/registration.yaml#/Registration`'s
        `holdExpiresAt` — a clean two-way "iff" against the current
        `status` value.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  if:
    properties:
      status:
        const: PENDING
  then:
    properties:
      resolvedAt:
        type: 'null'
  else:
    required: [resolvedAt]
    properties:
      resolvedAt:
        type: string

PaymentStatus:
  type: string
  enum: [PENDING, SUCCEEDED, FAILED, CANCELLED, REFUND_REQUIRED, REFUNDED]
  description: >-
    `../../../docs/technical-design/platform/database-schema.md` §5.1 /
    `../../../docs/technical-design/modules/payment.md` §1, §9. `PENDING`:
    charge initiated, outcome not yet known. `SUCCEEDED`, `FAILED`:
    resolved by the gateway. `CANCELLED`: resolved without a charge
    (including a charge refused by the circuit breaker after its row was
    written). `REFUND_REQUIRED`: the payment succeeded but its registration
    was no longer `RESERVED` (hold expired or cancelled), so the money is
    being returned — the seat is never re-granted. `REFUNDED`: the refund
    is confirmed. `FAILED`/`CANCELLED` are final for the `Idempotency-Key`
    that created them; a new attempt needs a new key. Clients must treat
    every value as possible from day one — `REFUNDED` is only reached once
    the gateway refund ships (Phase 3).

CreatePaymentChargeRequest:
  type: object
  description: >-
    **Body shape is inferred — flagged as an assumption.**
    `../../../docs/technical-design/modules/payment.md` never specifies this request's fields beyond
    "every `POST /api/v1/payments/charge` request carries a client-generated
    `Idempotency-Key` header" (§8). `paymentMethodToken` is modeled as an
    opaque token from the gateway's own client-side SDK (e.g. Stripe.js),
    never raw card data — consistent with `architecture.md` §5.4's
    "credentials never in source or committed config" discipline extended
    to the standard PCI-scope-avoidance pattern of never letting card
    details reach the Backend API at all, though no document states this
    field explicitly. **Phase 2 (checklist D11):** the Web Application
    sends one of Stripe's fixed **test** tokens (a success and a decline
    token), offered only when built with a test key; the field stays a
    generic opaque token so Stripe.js can produce it later without any API
    change.
  required: [registrationId, paymentMethodToken]
  properties:
    registrationId:
      type: string
      format: uuid
      description: Must reference a `RESERVED` registration the caller owns (`../../../docs/technical-design/modules/registration.md` §1) — a `PENDING`/other-status registration is a `409`.
    paymentMethodToken:
      type: string
      description: Opaque payment-method token from the gateway's client-side SDK. Never raw card data.
