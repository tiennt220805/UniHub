NotificationType:
  type: string
  enum: [REGISTRATION_CONFIRMED, WORKSHOP_CANCELLED, WORKSHOP_RESCHEDULED]
  description: '`../../../docs/technical-design/platform/database-schema.md` §7.1 — drives which template is rendered at dispatch time (`../../../docs/technical-design/modules/notification.md` §4). Not exhaustive; extended as new notification-triggering events are added.'

NotificationDeliveryStatus:
  type: string
  enum: [PENDING, SENT, FAILED]
  description: >-
    `../../../docs/technical-design/platform/database-schema.md` §7.1. **Delivery status, not read
    status** — this schema has no concept of "the student has seen this
    notification." See `Notification.description` below for why.

RelatedEntityType:
  type: string
  enum: [WORKSHOP, REGISTRATION]
  description: '`../../../docs/technical-design/platform/database-schema.md` §7.1.'

Notification:
  type: object
  description: >-
    One row from the in-app inbox. **Two things this response deliberately
    cannot provide, flagged rather than papered over:**

    1. **No rendered content (subject/body text).** `../../../docs/technical-design/platform/
    database-schema.md` §7.1's `notifications` table has no content/body
    column — `../../../docs/technical-design/modules/notification.md` §4 renders a template into
    text once, at dispatch time, and hands it directly to the channel's
    `send()`; nothing about that rendered text is persisted. This endpoint
    can only return the structured fields the row actually stores
    (`type`, `relatedEntityType`/`relatedEntityId`, `status`, timestamps) —
    a client must derive its own display copy from `type` (e.g. a
    client-side string table keyed by `NotificationType`), optionally
    enriched by fetching the related entity via `relatedEntityId`. Adding a
    persisted content column would be extending
    `database-schema.md` §7.1 beyond what that file specifies, which is
    not this contract's authority to do — flagged for a human decision.

    2. **No read/unread state.** There is no `read`/`read_at` column in
    `../../../docs/technical-design/platform/database-schema.md` §7.1 — `status` tracks delivery
    (`PENDING`/`SENT`/`FAILED`), never whether the recipient has seen it.
    A "mark as read" operation is not represented anywhere in this schema
    for the same reason: nothing to write it into.
  required: [id, type, relatedEntityType, relatedEntityId, status, createdAt]
  properties:
    id:
      type: string
      format: uuid
    type:
      $ref: '#/NotificationType'
    relatedEntityType:
      $ref: '#/RelatedEntityType'
    relatedEntityId:
      type: string
      format: uuid
      description: No FK at the database layer (`database-schema.md` §7.1's deliberate polymorphic-reference trade-off) — resolve against `relatedEntityType` client-side to fetch the underlying Workshop/Registration if needed.
    status:
      $ref: '#/NotificationDeliveryStatus'
    sentAt:
      type: [string, 'null']
      format: date-time
      description: >-
        Non-null if and only if `status` is `SENT`
        (`../../../docs/technical-design/modules/notification.md` §3's consumer sets `status`/
        `sentAt` together, and only a successful `send()` result is
        `SENT` — a `FAILED` result leaves `sentAt` unset). Structurally
        enforced below via `if`/`then`/`else`.
    createdAt:
      type: string
      format: date-time
      description: When the triggering lifecycle event was consumed and this row was created (`../../../docs/technical-design/modules/notification.md` §3), not when it was sent.
  if:
    properties:
      status:
        const: SENT
  then:
    required: [sentAt]
    properties:
      sentAt:
        type: string
  else:
    properties:
      sentAt:
        type: 'null'

NotificationListResponse:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: '#/Notification'
    page:
      $ref: '../common/pagination.yaml#/PageMeta'
  required: [items, page]
