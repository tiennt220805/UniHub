NotificationType:
  type: string
  enum: [REGISTRATION_CONFIRMED, WORKSHOP_CANCELLED, WORKSHOP_RESCHEDULED]
  description: '`../../../docs/technical-design/platform/database-schema.md` §7.1 — drives which template is rendered at dispatch time (`../../../docs/technical-design/modules/notification.md` §4). Not exhaustive; extended as new notification-triggering events are added.'

NotificationDeliveryStatus:
  type: string
  enum: [PENDING, SENT, FAILED]
  description: >-
    `../../../docs/technical-design/platform/database-schema.md` §7.1. **Delivery status, not read
    status** — this schema has no concept of "the student has seen this
    notification." See `Notification.description` below for why.

RelatedEntityType:
  type: string
  enum: [WORKSHOP, REGISTRATION]
  description: '`../../../docs/technical-design/platform/database-schema.md` §7.1.'

Notification:
  type: object
  description: >-
    One row of the in-app inbox (`channel = IN_APP`). `title` and `body` are
    the text rendered once when the row was created
    (`../../../docs/technical-design/modules/notification.md` §1, §4) and
    never re-rendered, so an old notification keeps its wording when a
    template changes (Phase 4 checklist D38).

    **No read/unread state, by decision.** `status` tracks delivery
    (`PENDING`/`SENT`/`FAILED`), never whether the recipient has seen the
    notification; there is no `read`/`read_at` column
    (`../../../docs/technical-design/platform/database-schema.md` §7.1) and no
    "mark as read" operation. Adding one later is an additive migration plus
    a new operation, not a change to this schema's existing fields.
  required: [id, type, title, body, relatedEntityType, relatedEntityId, status, createdAt]
  properties:
    id:
      type: string
      format: uuid
    type:
      $ref: '#/NotificationType'
    title:
      type: string
      maxLength: 200
      description: >-
        Rendered title (`notifications.title VARCHAR(200)`,
        `../../../docs/technical-design/platform/database-schema.md` §7.1).
        Nullable in the table only because `EMAIL` rows do not carry it; it is
        always filled on an `IN_APP` row, which is all this endpoint returns.
    body:
      type: string
      description: >-
        Rendered body text (`notifications.body TEXT`); always filled on an
        `IN_APP` row, for the same reason as `title`.
    relatedEntityType:
      $ref: '#/RelatedEntityType'
    relatedEntityId:
      type: string
      format: uuid
      description: No FK at the database layer (`database-schema.md` §7.1's deliberate polymorphic-reference trade-off) — resolve against `relatedEntityType` client-side to fetch the underlying Workshop/Registration if needed.
    status:
      $ref: '#/NotificationDeliveryStatus'
    sentAt:
      type: [string, 'null']
      format: date-time
      description: >-
        Non-null if and only if `status` is `SENT`
        (`../../../docs/technical-design/modules/notification.md` §3's consumer sets `status`/
        `sentAt` together, and only a successful `send()` result is
        `SENT` — a `FAILED` result leaves `sentAt` unset). Structurally
        enforced below via `if`/`then`/`else`.
    createdAt:
      type: string
      format: date-time
      description: When the triggering lifecycle event was consumed and this row was created (`../../../docs/technical-design/modules/notification.md` §3), not when it was sent.
  if:
    properties:
      status:
        const: SENT
  then:
    required: [sentAt]
    properties:
      sentAt:
        type: string
  else:
    properties:
      sentAt:
        type: 'null'

NotificationListResponse:
  type: object
  properties:
    items:
      type: array
      items:
        $ref: '#/Notification'
    page:
      $ref: '../common/pagination.yaml#/PageMeta'
  required: [items, page]
