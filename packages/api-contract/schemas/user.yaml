LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
      maxLength: 255
    password:
      type: string
      format: password

LoginResponse:
  type: object
  description: >-
    `../../../docs/technical-design/platform/auth-and-identity.md` §2's claim shape deliberately
    excludes "UI-convenience fields (display name, email, etc.)" from the
    token itself — "anything the client needs to render... belongs in the
    login endpoint's response body, issued once at login alongside the
    token." `user` below is exactly that body.
  required: [accessToken, expiresIn, user]
  properties:
    accessToken:
      type: string
      description: The HS256 auth JWT (`../../../docs/technical-design/platform/auth-and-identity.md` §3) — opaque to the client, carries the resolved `permissions[]` claim.
    expiresIn:
      type: integer
      description: Seconds until expiry — the fixed 30-minute access-token TTL (`../../../docs/technical-design/platform/auth-and-identity.md` §4).
      example: 1800
    user:
      $ref: '#/UserSummary'

UserSummary:
  type: object
  description: >-
    Exactly the fields `../../../docs/technical-design/platform/auth-and-identity.md` §2 names as
    belonging in the response body, not the token — nothing beyond that is
    added here. That section names three things by example: "the user's
    name, a greeting, which role labels apply" — `fullName`/`email` cover
    the first two, `roles` covers the third.
  required: [id, fullName, email, roles]
  properties:
    id:
      type: string
      format: uuid
    fullName:
      type: string
    email:
      type: string
      format: email
    roles:
      type: array
      items:
        type: string
      description: >-
        `roles.name` (`../../../docs/technical-design/platform/database-schema.md` §2.2) for every
        role assigned to this user — display labels only, e.g. for a
        "Signed in as: Organizer" UI treatment. **Never used for an
        authorization decision anywhere** — `auth-and-identity.md` §2 is
        explicit that role plays no part at request time; the token's own
        `permissions[]` claim is the only thing any `hasAuthority(...)`
        check reads. This field exists purely because the referenced
        section names role labels as exactly the kind of UI-convenience
        data that belongs in this response body, not the token.

LegacySyncRunStatus:
  type: string
  enum: [RUNNING, COMPLETED, FAILED]
  description: '`../../../docs/technical-design/modules/user.md` §5.'

LegacySyncFailureReason:
  type: string
  enum: [FILE_NOT_FOUND, FILE_UNREADABLE, PIPELINE_ERROR]
  description: '`../../../docs/technical-design/modules/user.md` §5.'

LegacySyncRun:
  type: object
  description: >-
    One row per nightly sync cycle — every cycle, successful or failed,
    leaves exactly one of these (`../../../docs/technical-design/modules/user.md` §5). Field-level
    source is `../../../docs/technical-design/platform/database-schema.md` §2.6.
  required: [id, exportDate, status, startedAt, rowsProcessed, rowsCreated, rowsUpdated, rowsQuarantined]
  properties:
    id:
      type: string
      format: uuid
    exportDate:
      type: string
      format: date
      description: The export's own date, not the run's start time — what the filename convention keys off (`../../../docs/technical-design/modules/user.md` §2).
    status:
      $ref: '#/LegacySyncRunStatus'
    failureReason:
      type: [string, 'null']
      description: >-
        Non-null if and only if `status` is `FAILED`. Structurally enforced
        below via `if`/`then`/`else` (one of two independent conditional
        rules on this schema, composed with `allOf` — see `finishedAt`
        below for the other).
    failureDetail:
      type: [string, 'null']
      description: Free-text detail (e.g. the parse error message) alongside the coded `failureReason` (`../../../docs/technical-design/modules/user.md` §5). No iff-rule enforced here — nothing in `user.md` states `failureDetail` is always present whenever `failureReason` is, only that it's captured "for `FILE_UNREADABLE`."
    startedAt:
      type: string
      format: date-time
    finishedAt:
      type: [string, 'null']
      description: >-
        Non-null if and only if `status` is not `RUNNING`
        (`../../../docs/technical-design/modules/user.md` §5's three `UPDATE` statements each set
        this alongside a terminal `status`; the initial `INSERT` sets
        neither). Structurally enforced below.
    rowsProcessed:
      type: integer
    rowsCreated:
      type: integer
    rowsUpdated:
      type: integer
    rowsQuarantined:
      type: integer
  allOf:
    - if:
        properties:
          status:
            const: RUNNING
      then:
        properties:
          finishedAt:
            type: 'null'
      else:
        required: [finishedAt]
        properties:
          finishedAt:
            type: string
    - if:
        properties:
          status:
            const: FAILED
      then:
        required: [failureReason]
        properties:
          failureReason:
            type: string
      else:
        properties:
          failureReason:
            type: 'null'

LegacySyncRunListResponse:
  type: object
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: '#/LegacySyncRun'
    page:
      $ref: '../common/pagination.yaml#/PageMeta'

LegacySyncErrorReasonCode:
  type: string
  enum: [MALFORMED_ROW, INVALID_FIELD, DUPLICATE_IN_FILE]
  description: '`../../../docs/technical-design/modules/user.md` §4/§6.'

LegacySyncError:
  type: object
  description: >-
    One quarantined record — a row rejected by the pipeline, never written
    to `users` (`../../../docs/technical-design/modules/user.md` §6). Field-level source is
    `../../../docs/technical-design/platform/database-schema.md` §2.7.
  required: [id, syncRunId, rowNumber, rawRow, reasonCode, reviewed, createdAt]
  properties:
    id:
      type: string
      format: uuid
    syncRunId:
      type: string
      format: uuid
    rowNumber:
      type: integer
    rawRow:
      type: string
      description: The full original CSV line, verbatim — lets an admin see exactly what the legacy system sent without re-opening the source file (`../../../docs/technical-design/modules/user.md` §6).
    reasonCode:
      $ref: '#/LegacySyncErrorReasonCode'
    reasonDetail:
      type: [string, 'null']
    reviewed:
      type: boolean
      description: Plain triage flag, not a workflow state machine (`../../../docs/technical-design/modules/user.md` §6) — no reviewer identity or timestamp is recorded, a deliberate scope cut, not an oversight.
    createdAt:
      type: string
      format: date-time

LegacySyncErrorListResponse:
  type: object
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: '#/LegacySyncError'
    page:
      $ref: '../common/pagination.yaml#/PageMeta'

ResolveLegacySyncErrorRequest:
  type: object
  required: [reviewed]
  properties:
    reviewed:
      type: boolean
      description: Toggles the triage flag directly — no reviewer identity or timestamp is captured alongside this write (`../../../docs/technical-design/modules/user.md` §6's deliberate scope cut).
