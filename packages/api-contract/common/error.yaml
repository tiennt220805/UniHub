type: object
description: >-
  RFC 7807 Problem Details for HTTP APIs (`application/problem+json`). Every
  non-2xx response across every UniHub module returns this shape — no module
  defines its own error envelope. Spring Boot 3.x's native
  `org.springframework.http.ProblemDetail` produces this shape directly, so no
  hand-rolled error-mapping layer is needed on the implementation side.
required:
  - type
  - title
  - status
  - correlationId
properties:
  type:
    type: string
    format: uri-reference
    description: >-
      A URI identifying the problem type. Every error a client must branch
      on has its own `type` — a stable contract: adding a value is a contract
      change, renaming or removing one is breaking
      (`../../../docs/guidelines/backend-coding-standards.md` §17):
      `urn:unihub:problem:sold-out` (409), `…:already-registered` (409),
      `…:registration-not-open` (409), `…:registration-not-reserved` (409),
      `…:payment-in-progress` (409), `…:idempotency-key-in-use` (409, the
      only retryable one), `…:idempotency-key-reused` (422). Every other
      error uses `about:blank`, where the `status` code alone conveys enough.
      A slug names a business condition, never an HTTP status, and a slug
      once used is never reused for another meaning. Clients must treat an
      unrecognised `type` by its `status` — that is what keeps adding a new
      `type` non-breaking.
    example: about:blank
  title:
    type: string
    description: Short, human-readable summary of the problem type. Constant per `type`.
    example: Conflict
  status:
    type: integer
    description: >-
      The HTTP status code, duplicated here (per RFC 7807) so the body is
      self-describing even if read outside the HTTP transport (e.g. from a
      log line).
    example: 409
  detail:
    type: string
    description: Human-readable explanation specific to this occurrence of the problem.
    example: Workshop is sold out.
  instance:
    type: string
    format: uri-reference
    description: URI identifying this specific occurrence — the request path, by convention in this API.
    example: /api/v1/registrations
  correlationId:
    allOf:
      - $ref: './headers.yaml#/CorrelationIdValue'
    description: >-
      The same value as the response's `X-Correlation-Id` header
      (`../../../docs/technical-design/platform/observability.md` §1) — the
      value to hand an operator when reporting this error. Always present,
      since the server generates one for every request; a value a client sends
      in the request header is ignored. A 32-hex-character OpenTelemetry trace
      ID, not a UUID.
