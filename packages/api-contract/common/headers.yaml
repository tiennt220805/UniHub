IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: >-
    Client-generated key guarding exactly-once execution of this write
    (`../../../docs/technical-design/modules/registration.md` §4, `../../../docs/technical-design/modules/payment.md` §8,
    `../../../docs/technical-design/platform/database-schema.md` §8.1). A retried request carrying the
    same key returns the original recorded result verbatim — the underlying
    business transaction is never re-run, not even as a no-op re-check.
    Present on this parameter list only on the specific write operations that
    declare it (registration-create, payment-charge) — not a blanket
    requirement on every `POST` in this API.
  schema:
    type: string
    format: uuid
  example: 6c1f7e2a-0b3d-4a9e-9b1a-2f6e6b8c9d10

CorrelationIdRequest:
  name: X-Correlation-Id
  in: header
  required: false
  description: >-
    Optional client-supplied correlation id (`../../../docs/technical-design/platform/observability.md`
    §1) — propagated through distributed tracing and echoed back on both
    success and error responses under the same header name. If the caller
    omits it, the server generates one and returns it via the
    `CorrelationIdResponse` header. The value is an OpenTelemetry trace ID
    (32 lowercase hex characters, per `observability.md`'s Correlation ID
    Identity ADR), not a UUID.
  schema:
    $ref: '#/CorrelationIdValue'

CorrelationIdResponse:
  description: >-
    The correlation id that traced this request end to end
    (`../../../docs/technical-design/platform/observability.md` §1) — the value to search for in logs
    or traces, and the same value carried in `error.yaml`'s `correlationId`
    field on a non-2xx response.
  schema:
    $ref: '#/CorrelationIdValue'

CorrelationIdValue:
  description: >-
    An OpenTelemetry / W3C trace ID: 32 lowercase hexadecimal characters
    (`../../../docs/technical-design/platform/observability.md` §1 — the trace ID *is* the correlation
    id; no separate UUID is minted). Declared once here so the request header,
    the response header and `error.yaml`'s `correlationId` field can never
    drift apart.
  type: string
  pattern: '^[0-9a-f]{32}$'
  example: 4bf92f3577b34da6a3ce929d0e0e4736

RetryAfter:
  description: >-
    Seconds to wait before retrying. Backs two distinct `503`/`429`
    situations in this API, both transient and safe to retry after the
    stated delay: a coordination-layer unavailability (a Redis seat-lock or
    the shared `paymentGateway` circuit breaker,
    `../../../docs/technical-design/modules/registration.md` §2 / `../../../docs/technical-design/modules/payment.md` §2-§3),
    or a rate limit (`../../../docs/technical-design/platform/distributed-coordination.md` §3's
    `RRateLimiter`). The two mechanisms are unrelated — this header shape
    is the only thing they share.
  schema:
    type: integer
